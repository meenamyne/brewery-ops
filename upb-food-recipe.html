function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtB(n){const v=+n;if(!v&&v!==0)return"—";return"฿"+v.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtP(n){const v=+n;if(n===null||n===undefined||n==="")return"—";return(v*100).toFixed(1)+"%";}
function pctColor(p){if(p===null||p===undefined||p==="")return"#9ca3af";const v=+p;if(v<=0.35)return"#16a34a";if(v<=0.50)return"#d97706";return"#dc2626";}

/* ── cost calc ─────────────────── */
function calcMenuCost(menuId,recipeLines,menu){
  const lines=recipeLines.filter(r=>String(r.menu_id)===String(menuId));
  const rawCost=lines.reduce((s,l)=>s+parseFloat(l.ingredient_cost||0),0);
  const spice=parseFloat(menu?.spice_pct||0.10);
  const target=parseFloat(menu?.target_food_cost_pct||0.35);
  const price=parseFloat(menu?.actual_price||0);
  const totalCost=rawCost*(1+spice);
  const suggestExcl=target>0?totalCost/target:0;
  const suggestIncl=suggestExcl*1.07;
  const foodCostPct=price>0?totalCost/price:null;
  return{rawCost,totalCost,suggestExcl,suggestIncl,foodCostPct,lineCount:lines.length};
}
function calcLineIngCost(ingredient,usageQty){
  const cpu=parseFloat(ingredient?.cost_per_unit||0);
  const yld=parseFloat(ingredient?.yield_pct||1);
  const qty=parseFloat(usageQty||0);
  if(yld<=0)return 0;
  return(cpu/yld)*qty;
}

/* ── Sheets helpers ─────────────── */
function gvizFetch(sid,sname){
  return new Promise((res,rej)=>{
    const cb="_gv_"+uid();
    const url=`https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:json&tq=select+*&sheet=${encodeURIComponent(sname)}&cb=${cb}`;
    window[cb]=(d)=>{delete window[cb];document.head.removeChild(s);res(d);};
    const s=document.createElement("script");s.src=url;
    s.onerror=()=>{delete window[cb];rej(new Error("gviz fail"));};
    document.head.appendChild(s);
    setTimeout(()=>{if(window[cb]){delete window[cb];rej(new Error("timeout"));}},10000);
  });
}
async function sheetsRead(sid,sname){
  try{
    const raw=await gvizFetch(sid,sname);
    const cols=(raw.table?.cols||[]).map(c=>c.label||c.id||"");
    const rows=(raw.table?.rows||[]).map(r=>{const o={};(r.c||[]).forEach((c,i)=>{o[cols[i]]=c?.v??c?.f??"";});return o;});
    return rows.filter(r=>Object.values(r).some(v=>v!==null&&v!==""));
  }catch(e){return null;}
}
async function sheetsApiRead(tok,sid,tab){
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(tab)}`,{headers:{"Authorization":"Bearer "+tok}});
    if(!r.ok)return null;
    const j=await r.json();const vals=j.values||[];
    if(vals.length<2)return null;
    const h=vals[0];
    return vals.slice(1).map(row=>{const o={};h.forEach((k,i)=>{o[k]=row[i]??"";});return o;}).filter(r=>Object.values(r).some(v=>v!==""));
  }catch(e){return null;}
}
async function sheetsApiWrite(tok,sid,tab,headers,rows){
  const drows=rows.map(r=>headers.map(h=>{const v=r[h];return v==null?"":String(v);}));
  const empty=headers.map(()=>"");
  const PAD=Math.max(500,drows.length+50);
  for(let i=drows.length;i<PAD;i++)drows.push(empty);
  const range=`${tab}!A1`;
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,{
    method:"PUT",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
    body:JSON.stringify({range,majorDimension:"ROWS",values:[headers,...drows]})
  });
}
async function sheetsEnsure(tok,sid,tab,headers){
  const meta=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}?fields=sheets.properties.title`,
    {headers:{"Authorization":"Bearer "+tok}}).then(r=>r.json());
  const exists=(meta.sheets||[]).some(s=>s.properties.title===tab);
  if(!exists){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}:batchUpdate`,{
      method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
      body:JSON.stringify({requests:[{addSheet:{properties:{title:tab}}}]})
    });
    await sheetsApiWrite(tok,sid,tab,headers,[]);
  }
}

/* ── useAuth ─────────────────────── */
const _KEY="upb_food_hint";let _rt=null;
function useAuth(){
  const[token,setToken]=useState(null);
  const[gisReady,setGisReady]=useState(false);
  const cRef=useRef(null);
  useEffect(()=>{
    const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;
    s.onload=()=>setGisReady(true);document.head.appendChild(s);
  },[]);
  const schedRefresh=useCallback(()=>{
    if(_rt)clearTimeout(_rt);
    _rt=setTimeout(()=>{
      if(!cRef.current)return;
      cRef.current.requestAccessToken({prompt:"",login_hint:localStorage.getItem(_KEY)||""});
    },55*60*1000);
  },[]);
  const initClient=useCallback(()=>{
    if(!gisReady||cRef.current)return;
    cRef.current=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,scope:SCOPES,
      callback:(resp)=>{
        if(resp.access_token){
          setToken(resp.access_token);schedRefresh();
          try{const p=JSON.parse(atob(resp.access_token.split(".")[1]||"e30="));if(p.email)localStorage.setItem(_KEY,p.email);}catch(e){}
        }
      }
    });
  },[gisReady,schedRefresh]);
  useEffect(()=>{initClient();},[initClient]);
  const login=useCallback(()=>{if(cRef.current)cRef.current.requestAccessToken();},[]);
  return{token,login,gisReady};
}

/* ── useSave ─────────────────────── */
function dedup(rows,pk){const m=new Map();rows.forEach(r=>{if(r[pk]!==undefined&&r[pk]!=="")m.set(r[pk],r);});return[...m.values()];}
function useSave(tabName,headers,initial){
  const[data,setData]=useState(initial);
  const[synced,setSynced]=useState(false);
  const[saveError,setSaveError]=useState(false);
  const tRef=useRef(null);
  const dirtyRef=useRef(false);
  const[saveVer,setSaveVer]=useState(0);
  const alRef=useRef(false);
  const setToken=useCallback((t)=>{
    tRef.current=t;
    sheetsApiRead(t,SPREADSHEET_ID,tabName).then(rows=>{
      alRef.current=true;
      if(rows&&rows.length>0){
        if(!dirtyRef.current)setData(dedup(rows,headers[0]));
      }else{dirtyRef.current=true;setSaveVer(v=>v+1);}
    });
  },[tabName,headers]);
  useEffect(()=>{
    sheetsRead(SPREADSHEET_ID,tabName).then(rows=>{
      if(rows&&rows.length>0&&!alRef.current&&!tRef.current)setData(dedup(rows,headers[0]));
      setSynced(true);
    }).catch(()=>setSynced(true));
  },[tabName,headers]);
  useEffect(()=>{
    if(!dirtyRef.current||!tRef.current)return;
    const t=setTimeout(async()=>{
      if(!dirtyRef.current)return;
      try{
        await sheetsEnsure(tRef.current,SPREADSHEET_ID,tabName,headers);
        await sheetsApiWrite(tRef.current,SPREADSHEET_ID,tabName,headers,data);
        dirtyRef.current=false;setSaveError(false);
      }catch(e){console.error("[useSave]",tabName,e);setSaveError(true);}
    },1200);
    return()=>clearTimeout(t);
  },[data,saveVer,tabName,headers]);
  const update=useCallback((fn)=>{setData(fn);dirtyRef.current=true;setSaveVer(v=>v+1);},[]);
  const forcePush=useCallback(()=>{if(tRef.current){dirtyRef.current=true;setSaveVer(v=>v+1);}},[]);
  return[data,update,synced,setToken,forcePush,saveError];
}
</script>

function Modal({open,onClose,title,children,wide}){

  return <div className="ov" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="mb" style={{maxWidth:wide?860:560}}>

}

function CatBadge({cat}){
  const c=CCOL[cat]||{bg:"#f3f4f6",tx:"#6b7280"};
  return <span className="badge" style={{background:c.bg,color:c.tx}}>{CICO[cat]||"🍽️"} {cat}</span>;
}

function PctBadge({pct}){
  if(pct===null||pct===undefined||pct==="")return <span style={{color:"#9ca3af",fontSize:13}}>—</span>;
  const v=+pct;
  const bg=v<=0.35?"#dcfce7":v<=0.50?"#fef9c3":"#fee2e2";
  const tx=v<=0.35?"#166534":v<=0.50?"#92400e":"#991b1b";
  return <span className="badge" style={{background:bg,color:tx}}>{(v*100).toFixed(1)}%</span>;
}

/* ── MenusPage ─────────────────────── */
function MenusPage({menus,updateMenus,setSelectedMenu}){
  const[cat,setCat]=useState("All");
  const[search,setSearch]=useState("");
  const[editM,setEditM]=useState(null);

  const[delId,setDelId]=useState(null);

  const filtered=useMemo(()=>menus.filter(m=>{
    if(cat!=="All"&&m.category!==cat)return false;
    if(search){const s=search.toLowerCase();return m.name_en?.toLowerCase().includes(s)||m.name_th?.includes(search)||m.menu_id?.toLowerCase().includes(s);}
    return true;
  }),[menus,cat,search]);

  function saveMenu(m){
    updateMenus(prev=>{const i=prev.findIndex(x=>x.id===m.id);if(i>=0){const n=[...prev];n[i]=m;return n;}return[...prev,m];});
  }
  function delMenu(id){updateMenus(prev=>prev.filter(m=>m.id!==id));setDelId(null);}

  return <div style={{flex:1,padding:"28px 32px",overflowY:"auto"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>

        <h2 style={{fontSize:22,fontWeight:700,margin:0}}>All Menus</h2>
        <div style={{fontSize:13,color:"#6b7280",marginTop:2}}>{menus.length} items total</div>
      </div>
      <button onClick={()=>setShowAdd(true)} className="btn btn-g">+ Add Menu</button>
    </div>

    <div style={{display:"flex",gap:10,marginBottom:16,flexWrap:"wrap"}}>
      {CATS.map(c=><button key={c} onClick={()=>setCat(c)}
        className="btn" style={{fontSize:12,padding:"5px 12px",
          background:cat===c?"#166534":"#f1f5f9",color:cat===c?"#fff":"#374151"}}>{c}</button>)}
      <input className="inp" placeholder="Search..." value={search} onChange={e=>setSearch(e.target.value)} style={{width:200,marginLeft:"auto"}}/>
    </div>

    <div className="card" style={{overflow:"hidden"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th className="th">ID</th><th className="th">Menu Name</th><th className="th">Category</th>
          <th className="th" style={{textAlign:"right"}}>Actual Price</th>
          <th className="th">Status</th><th className="th">Actions</th>
        </tr></thead>
        <tbody>{filtered.map(m=><tr key={m.id}>
          <td className="td" style={{fontWeight:600,color:"#166534",fontSize:12}}>{m.menu_id}</td>
          <td className="td">
            <div style={{fontWeight:500}}>{m.name_en}</div>
            <div style={{fontSize:11,color:"#9ca3af"}}>{m.name_th}</div>
          </td>
          <td className="td"><CatBadge cat={m.category}/></td>
          <td className="td" style={{textAlign:"right",fontWeight:600}}>{m.actual_price!==""&&m.actual_price!==null?fmtB(m.actual_price):"—"}</td>
          <td className="td">{m.checked?<span className="badge" style={{background:"#dcfce7",color:"#166534"}}>✓ Done</span>:<span className="badge" style={{background:"#f3f4f6",color:"#6b7280"}}>Draft</span>}</td>
          <td className="td">
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>setSelectedMenu(m.id)} className="btn btn-o" style={{fontSize:12,padding:"4px 10px"}}>📖 Recipe</button>
              <button onClick={()=>setEditM(m)} className="btn btn-o" style={{fontSize:12,padding:"4px 10px"}}>Edit</button>
              <button onClick={()=>setDelId(m.id)} className="btn" style={{fontSize:12,padding:"4px 10px",background:"#fee2e2",color:"#991b1b"}}>Del</button>
            </div>
          </td>
        </tr>)}</tbody>
      </table>
    </div>

    <EditMenuModal open={showAdd||!!editM} onClose={()=>{setShowAdd(false);setEditM(null);}} menu={editM} onSave={saveMenu}/>

    {delId&&<div className="ov">
      <div className="mb" style={{maxWidth:380}}>
        <h3 style={{fontSize:16,fontWeight:700,margin:"0 0 8px"}}>Delete Menu?</h3>
        <p style={{fontSize:13,color:"#6b7280",marginBottom:20}}>This cannot be undone. Recipe lines and steps will remain in Sheets.</p>
        <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
          <button onClick={()=>setDelId(null)} className="btn btn-o">Cancel</button>
          <button onClick={()=>delMenu(delId)} className="btn btn-r">Delete</button>
        </div>
      </div>
    </div>}
  </div>;
}

/* ── IngredientsPage ─────────────────── */
function IngredientsPage({ingredients,updateIngredients}){
  const[editI,setEditI]=useState(null);
  const[showAdd,setShowAdd]=useState(false);
  const[delId,setDelId]=useState(null);
  const[search,setSearch]=useState("");

    if(!search)return ingredients;
    const s=search.toLowerCase();
    return ingredients.filter(i=>i.name?.toLowerCase().includes(s));

  function save(i){updateIngredients(prev=>{const idx=prev.findIndex(x=>x.id===i.id);if(idx>=0){const n=[...prev];n[idx]=i;return n;}return[...prev,i];});}
  function del(id){updateIngredients(prev=>prev.filter(i=>i.id!==id));setDelId(null);}

    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>

/* ── EditRecipeModal ─────────────────── */
function EditRecipeModal({open,onClose,menu,recipeLines,updateRecipeLines,ingredients}){
  const lines=useMemo(()=>recipeLines.filter(r=>String(r.menu_id)===String(menu?.id)),[recipeLines,menu]);
  const[nl,setNl]=useState({ingredient_id:"",ingredient_name:"",usage_qty:"",usage_unit:""});
  const selIngr=useMemo(()=>ingredients.find(i=>i.id===nl.ingredient_id),[ingredients,nl.ingredient_id]);
  const previewCost=useMemo(()=>calcLineIngCost(selIngr,nl.usage_qty),[selIngr,nl.usage_qty]);

  function onSelectIngr(id){
    const i=ingredients.find(x=>x.id===id);
    setNl(p=>({...p,ingredient_id:id,ingredient_name:i?.name||"",usage_unit:i?.purchase_unit||""}));
  }
  function addLine(){
    if(!nl.ingredient_id||!nl.usage_qty)return;
    const line={id:uid(),menu_id:menu.id,ingredient_id:nl.ingredient_id,ingredient_name:nl.ingredient_name,
      usage_qty:+nl.usage_qty,usage_unit:nl.usage_unit,ingredient_cost:previewCost};
    updateRecipeLines(prev=>[...prev,line]);
    setNl({ingredient_id:"",ingredient_name:"",usage_qty:"",usage_unit:""});
  }
  function delLine(id){updateRecipeLines(prev=>prev.filter(l=>l.id!==id));}

  if(!menu)return null;
  return <Modal open={open} onClose={onClose} title={`Recipe Ingredients — ${menu.menu_id}`} wide>
    {/* existing lines */}
    {lines.length===0?<div style={{padding:"20px 0",textAlign:"center",color:"#9ca3af",fontSize:13}}>No ingredients added yet. Use the form below.</div>:
    <div className="card" style={{overflow:"hidden",marginBottom:20}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th className="th">Ingredient</th><th className="th" style={{textAlign:"right"}}>Usage Qty</th>
          <th className="th">Unit</th><th className="th" style={{textAlign:"right"}}>Ingredient Cost</th><th className="th"/>
        </tr></thead>
        <tbody>{lines.map(l=><tr key={l.id}>
          <td className="td" style={{fontWeight:500}}>{l.ingredient_name}</td>
          <td className="td" style={{textAlign:"right"}}>{l.usage_qty}</td>
          <td className="td" style={{color:"#6b7280"}}>{l.usage_unit||"—"}</td>
          <td className="td" style={{textAlign:"right",fontWeight:600}}>{fmtB(l.ingredient_cost)}</td>
          <td className="td"><button onClick={()=>delLine(l.id)} className="btn" style={{fontSize:11,padding:"3px 8px",background:"#fee2e2",color:"#991b1b"}}>✕</button></td>
        </tr>)}
        <tr><td colSpan={3} className="td" style={{fontWeight:700,textAlign:"right"}}>Raw total:</td>
          <td className="td" style={{fontWeight:700,color:"#166534"}}>{fmtB(lines.reduce((s,l)=>s+parseFloat(l.ingredient_cost||0),0))}</td>
          <td className="td"/>
        </tr></tbody>
      </table>
    </div>}

    {/* add line form */}
    <div className="card" style={{padding:18}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:12,color:"#374151"}}>➕ Add Ingredient Line</div>
      {ingredients.length===0?<div style={{fontSize:13,color:"#d97706",padding:"10px 0"}}>⚠️ No ingredients in master list. Go to <strong>Ingredients</strong> page to add some first.</div>:
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr auto",gap:10,alignItems:"end"}}>
        <div>
          <label className="fl">Ingredient</label>
          <select className="inp" value={nl.ingredient_id} onChange={e=>onSelectIngr(e.target.value)}>
            <option value="">— select —</option>
            {ingredients.map(i=><option key={i.id} value={i.id}>{i.name} ({fmtB(i.cost_per_unit)}/{i.purchase_unit||"unit"})</option>)}
          </select>
        </div>
        <div>
          <label className="fl">Usage Qty</label>
          <input className="inp" type="number" min="0" step="0.001" value={nl.usage_qty} onChange={e=>setNl(p=>({...p,usage_qty:e.target.value}))}/>
        </div>
        <div>
          <label className="fl">Unit</label>
          <input className="inp" value={nl.usage_unit} onChange={e=>setNl(p=>({...p,usage_unit:e.target.value}))} placeholder="kg, g…"/>
        </div>
        <div>
          <button onClick={addLine} className="btn btn-g" disabled={!nl.ingredient_id||!nl.usage_qty}>Add</button>
        </div>
      </div>}
      {selIngr&&nl.usage_qty&&<div style={{marginTop:10,fontSize:12,color:"#6b7280"}}>
        Cost: ({fmtB(selIngr.cost_per_unit)} ÷ {(+selIngr.yield_pct*100).toFixed(0)}%) × {nl.usage_qty} = <strong style={{color:"#166534"}}>{fmtB(previewCost)}</strong>
      </div>}
    </div>
    <div style={{display:"flex",justifyContent:"flex-end",marginTop:16}}>
      <button onClick={onClose} className="btn btn-g">Done</button>
    </div>
  </Modal>;
}

/* ── RecipePage ─────────────────────── */
function RecipePage({menuId,menus,updateMenus,recipeLines,updateRecipeLines,cookingSteps,updateCookingSteps,ingredients,onBack}){
  const menu=useMemo(()=>menus.find(m=>m.id===menuId),[menus,menuId]);
  const[showEdit,setShowEdit]=useState(false);
  const[showAddStep,setShowAddStep]=useState(false);
  const[stepText,setStepText]=useState("");
  const[editStep,setEditStep]=useState(null);
  const[localPrice,setLocalPrice]=useState("");

  const myLines=useMemo(()=>recipeLines.filter(r=>String(r.menu_id)===String(menuId)),[recipeLines,menuId]);
  const mySteps=useMemo(()=>cookingSteps.filter(s=>String(s.menu_id)===String(menuId)).sort((a,b)=>+a.step_no-+b.step_no),[cookingSteps,menuId]);
  const cost=useMemo(()=>menu?calcMenuCost(menuId,recipeLines,menu):{rawCost:0,totalCost:0,suggestExcl:0,suggestIncl:0,foodCostPct:null,lineCount:0},[menuId,recipeLines,menu]);

  useEffect(()=>{if(menu)setLocalPrice(menu.actual_price===""?"":String(menu.actual_price));},[menu?.id]);

  function savePrice(){
    const val=localPrice===""?"":+localPrice;
    updateMenus(prev=>prev.map(m=>m.id===menuId?{...m,actual_price:val}:m));
  }
  function updateMenuField(k,v){
    updateMenus(prev=>prev.map(m=>m.id===menuId?{...m,[k]:v}:m));
  }
  function addStep(){
    if(!stepText.trim())return;
    const maxNo=mySteps.length>0?Math.max(...mySteps.map(s=>+s.step_no)):0;
    const s={id:uid(),menu_id:menuId,step_no:maxNo+1,instruction:stepText.trim()};
    updateCookingSteps(prev=>[...prev,s]);
    setStepText("");setShowAddStep(false);
  }
  function delStep(id){updateCookingSteps(prev=>prev.filter(s=>s.id!==id));}
  function saveStep(id,text){
    updateCookingSteps(prev=>prev.map(s=>s.id===id?{...s,instruction:text}:s));
    setEditStep(null);
  }

  if(!menu)return <div style={{flex:1,padding:32,color:"#9ca3af"}}>Menu not found.</div>;

  const catC=CCOL[menu.category]||{bg:"#f3f4f6",tx:"#6b7280"};
  return <div style={{flex:1,padding:"28px 32px",overflowY:"auto"}}>
    <button onClick={onBack} className="btn btn-o" style={{marginBottom:16,fontSize:12}}>← Back to Dashboard</button>

    {/* header */}
    <div className="card" style={{padding:"20px 24px",marginBottom:20}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <span style={{fontWeight:800,fontSize:13,color:"#166534"}}>{menu.menu_id}</span>
            <CatBadge cat={menu.category}/>
            {menu.checked&&<span className="badge" style={{background:"#dcfce7",color:"#166534"}}>✓ Verified</span>}
          </div>
          <h2 style={{fontSize:22,fontWeight:700,margin:"0 0 2px"}}>{menu.name_en}</h2>
          <div style={{fontSize:14,color:"#9ca3af"}}>{menu.name_th}</div>
        </div>
        <button onClick={()=>setShowEdit(true)} className="btn btn-a">✏️ Edit Ingredients</button>
      </div>

      {/* settings row */}
      <div style={{display:"flex",gap:20,marginTop:18,flexWrap:"wrap"}}>
        <div>
          <div style={{fontSize:11,color:"#9ca3af",fontWeight:700,textTransform:"uppercase"}}>Serves/Recipe</div>
          <input className="inp" type="number" min="1" value={menu.serves_per_recipe||1}
            onChange={e=>updateMenuField("serves_per_recipe",+e.target.value)}
            style={{width:80,marginTop:4}}/>
        </div>
        <div>
          <div style={{fontSize:11,color:"#9ca3af",fontWeight:700,textTransform:"uppercase"}}>Spice Allowance %</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
            <input className="inp" type="number" step="1" min="0" max="100"
              value={Math.round((+menu.spice_pct||0.10)*100)}
              onChange={e=>updateMenuField("spice_pct",+e.target.value/100)}
              style={{width:70}}/><span style={{fontSize:13,color:"#6b7280"}}>%</span>
          </div>
        </div>
        <div>
          <div style={{fontSize:11,color:"#9ca3af",fontWeight:700,textTransform:"uppercase"}}>Target Food Cost %</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
            <input className="inp" type="number" step="1" min="1" max="100"
              value={Math.round((+menu.target_food_cost_pct||0.35)*100)}
              onChange={e=>updateMenuField("target_food_cost_pct",+e.target.value/100)}
              style={{width:70}}/><span style={{fontSize:13,color:"#6b7280"}}>%</span>
          </div>
        </div>
        <div>
          <div style={{fontSize:11,color:"#9ca3af",fontWeight:700,textTransform:"uppercase"}}>Actual Selling Price</div>
          <div style={{display:"flex",alignItems:"center",gap:6,marginTop:4}}>
            <span style={{fontSize:13}}>฿</span>
            <input className="inp" type="number" min="0" value={localPrice}
              onChange={e=>setLocalPrice(e.target.value)}
              onBlur={savePrice} style={{width:90}}/>
          </div>
        </div>
      </div>
    </div>

    {/* cost summary */}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
      <div className="card" style={{padding:"18px 22px"}}>
        <div style={{fontSize:13,fontWeight:700,color:"#374151",marginBottom:14}}>📊 Cost Breakdown</div>
        {[
          ["Raw ingredient cost",fmtB(cost.rawCost),"#374151"],
          [`Spice allowance (${Math.round((+menu.spice_pct||0.10)*100)}%)`,fmtB(cost.rawCost*(+menu.spice_pct||0.10)),"#6b7280"],
          ["Total cost / serve",fmtB(cost.totalCost),"#111827"],
        ].map(([k,v,c])=><div key={k} style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{fontSize:13,color:"#6b7280"}}>{k}</span>
          <span style={{fontSize:13,fontWeight:600,color:c}}>{v}</span>
        </div>)}
        <div style={{borderTop:"1px solid #f1f5f9",margin:"10px 0"}}/>
        {[
          ["Suggested price (excl. 7% VAT)",fmtB(cost.suggestExcl),"#166534"],
          ["Suggested price (incl. 7% VAT)",fmtB(cost.suggestIncl),"#166534"],
        ].map(([k,v,c])=><div key={k} style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{fontSize:13,color:"#6b7280"}}>{k}</span>
          <span style={{fontSize:14,fontWeight:700,color:c}}>{v}</span>
        </div>)}
      </div>
      <div className="card" style={{padding:"18px 22px"}}>
        <div style={{fontSize:13,fontWeight:700,color:"#374151",marginBottom:14}}>💰 Pricing Analysis</div>
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,color:"#9ca3af",fontWeight:700,textTransform:"uppercase",marginBottom:4}}>Actual Food Cost %</div>
          {cost.foodCostPct!==null?<>
            <div style={{fontSize:32,fontWeight:800,color:pctColor(cost.foodCostPct)}}>{(cost.foodCostPct*100).toFixed(1)}%</div>
            <div style={{fontSize:12,color:"#9ca3af",marginTop:2}}>
              {cost.foodCostPct<=0.35?"✅ On target":cost.foodCostPct<=0.50?"⚠️ Slightly high":"🔴 High — consider adjusting"}
            </div>
          </>:<div style={{fontSize:13,color:"#9ca3af"}}>Set actual selling price to see food cost %</div>}
        </div>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
          <span style={{fontSize:13,color:"#6b7280"}}>Actual price</span>
          <span style={{fontSize:13,fontWeight:600}}>{localPrice?fmtB(+localPrice):"—"}</span>
        </div>
        <div style={{display:"flex",justifyContent:"space-between"}}>
          <span style={{fontSize:13,color:"#6b7280"}}>Target ({Math.round((+menu.target_food_cost_pct||0.35)*100)}%)</span>
          <span style={{fontSize:13,fontWeight:600,color:"#166534"}}>{fmtB(cost.suggestExcl)}</span>
        </div>
      </div>
    </div>

    {/* recipe lines */}
    <div className="card" style={{padding:"18px 22px",marginBottom:20}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:700}}>🧂 Recipe Ingredients ({cost.lineCount})</div>
        <button onClick={()=>setShowEdit(true)} className="btn btn-o" style={{fontSize:12}}>Edit</button>
      </div>
      {myLines.length===0?<div style={{textAlign:"center",padding:"20px 0",color:"#9ca3af",fontSize:13}}>No ingredients yet. Click Edit to add.</div>:
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th className="th">Ingredient</th><th className="th" style={{textAlign:"right"}}>Usage Qty</th>
          <th className="th">Unit</th><th className="th" style={{textAlign:"right"}}>Cost</th>
        </tr></thead>
        <tbody>{myLines.map(l=><tr key={l.id}>
          <td className="td" style={{fontWeight:500}}>{l.ingredient_name}</td>
          <td className="td" style={{textAlign:"right"}}>{l.usage_qty}</td>
          <td className="td" style={{color:"#6b7280"}}>{l.usage_unit||"—"}</td>
          <td className="td" style={{textAlign:"right",fontWeight:600}}>{fmtB(l.ingredient_cost)}</td>
        </tr>)}
        <tr>
          <td colSpan={3} className="td" style={{fontWeight:700,textAlign:"right"}}>Raw total:</td>
          <td className="td" style={{fontWeight:700,color:"#166534"}}>{fmtB(cost.rawCost)}</td>
        </tr></tbody>
      </table>}
    </div>

    {/* cooking steps */}
    <div className="card" style={{padding:"18px 22px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
        <div style={{fontSize:14,fontWeight:700}}>👨‍🍳 Cooking Steps ({mySteps.length})</div>
        <button onClick={()=>setShowAddStep(true)} className="btn btn-o" style={{fontSize:12}}>+ Add Step</button>
      </div>
      {mySteps.length===0?<div style={{textAlign:"center",padding:"20px 0",color:"#9ca3af",fontSize:13}}>No steps recorded yet.</div>:
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {mySteps.map((s,i)=><div key={s.id} style={{display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{minWidth:28,height:28,borderRadius:"50%",background:"#166534",color:"#fff",
            display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{i+1}</div>
          {editStep===s.id?<div style={{flex:1,display:"flex",gap:8}}>
            <input className="inp" defaultValue={s.instruction} id={"step_"+s.id} style={{flex:1}}/>
            <button onClick={()=>saveStep(s.id,document.getElementById("step_"+s.id).value)} className="btn btn-g" style={{fontSize:12}}>Save</button>
            <button onClick={()=>setEditStep(null)} className="btn btn-o" style={{fontSize:12}}>✕</button>
          </div>:<>
            <div style={{flex:1,fontSize:14,color:"#374151",paddingTop:4}}>{s.instruction}</div>
            <button onClick={()=>setEditStep(s.id)} className="btn btn-o" style={{fontSize:11,padding:"3px 8px"}}>Edit</button>
            <button onClick={()=>delStep(s.id)} className="btn" style={{fontSize:11,padding:"3px 8px",background:"#fee2e2",color:"#991b1b"}}>✕</button>
          </>}
        </div>)}
      </div>}

      {showAddStep&&<div style={{marginTop:14,display:"flex",gap:10}}>
        <input className="inp" placeholder="Describe this step…" value={stepText} onChange={e=>setStepText(e.target.value)} style={{flex:1}}
          onKeyDown={e=>{if(e.key==="Enter")addStep();}}/>
        <button onClick={addStep} className="btn btn-g">Add</button>
        <button onClick={()=>{setShowAddStep(false);setStepText("");}} className="btn btn-o">✕</button>
      </div>}
    </div>

    <EditRecipeModal open={showEdit} onClose={()=>setShowEdit(false)} menu={menu}
      recipeLines={recipeLines} updateRecipeLines={updateRecipeLines} ingredients={ingredients}/>
  </div>;
}

/* ── DashboardPage ─────────────────── */
function DashboardPage({menus,recipeLines,setSelectedMenu,setPage}){
  const[cat,setCat]=useState("All");
  const[search,setSearch]=useState("");

  const enriched=useMemo(()=>menus.map(m=>{
    const c=calcMenuCost(m.id,recipeLines,m);
    return{...m,...c};
  }),[menus,recipeLines]);

  const withPrice=useMemo(()=>enriched.filter(m=>m.foodCostPct!==null),[enriched]);
  const avgFoodCost=useMemo(()=>{
    if(!withPrice.length)return null;
    return withPrice.reduce((s,m)=>s+m.foodCostPct,0)/withPrice.length;
  },[withPrice]);
  const withRecipe=useMemo(()=>enriched.filter(m=>m.lineCount>0).length,[enriched]);

  const filtered=useMemo(()=>enriched.filter(m=>{
    if(cat!=="All"&&m.category!==cat)return false;
    if(search){const s=search.toLowerCase();return m.name_en?.toLowerCase().includes(s)||m.name_th?.includes(search)||m.menu_id?.toLowerCase().includes(s);}
    return true;
  }),[enriched,cat,search]);

  function goRecipe(menuId){setSelectedMenu(menuId);setPage("recipe");}

  const statStyle={flex:1,minWidth:160};
  return <div style={{flex:1,padding:"28px 32px",overflowY:"auto"}}>
    <div style={{marginBottom:24}}>
      <h2 style={{fontSize:24,fontWeight:800,margin:"0 0 4px"}}>Dashboard</h2>
      <div style={{fontSize:14,color:"#6b7280"}}>UPB Kitchen — Food Cost Overview</div>
    </div>

    {/* stats */}
    <div style={{display:"flex",gap:16,marginBottom:24,flexWrap:"wrap"}}>
      {[
        {label:"Total Menus",val:menus.length,icon:"📋",color:"#166534",bg:"#dcfce7"},
        {label:"With Recipe",val:withRecipe,icon:"📖",color:"#1d4ed8",bg:"#dbeafe"},
        {label:"Avg Food Cost",val:avgFoodCost!==null?fmtP(avgFoodCost):"—",icon:"💹",color:avgFoodCost!==null?pctColor(avgFoodCost):"#9ca3af",bg:"#f3f4f6"},
        {label:"With Price Set",val:withPrice.length,icon:"💰",color:"#92400e",bg:"#fef3c7"},
      ].map(({label,val,icon,color,bg})=>
        <div key={label} className="card" style={{...statStyle,padding:"18px 22px"}}>
          <div style={{fontSize:24,marginBottom:8}}>{icon}</div>
          <div style={{fontSize:28,fontWeight:800,color}}>{val}</div>
          <div style={{fontSize:13,color:"#6b7280",marginTop:2}}>{label}</div>
        </div>
      )}
    </div>

    {/* filter */}
    <div style={{display:"flex",gap:10,marginBottom:14,flexWrap:"wrap"}}>
      {CATS.map(c=><button key={c} onClick={()=>setCat(c)} className="btn"
        style={{fontSize:12,padding:"5px 12px",background:cat===c?"#166534":"#f1f5f9",color:cat===c?"#fff":"#374151"}}>{c}</button>)}
      <input className="inp" placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)} style={{width:200,marginLeft:"auto"}}/>
    </div>

    <div className="card" style={{overflow:"hidden"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th className="th">Menu</th><th className="th">Category</th>
          <th className="th" style={{textAlign:"right"}}>Recipe Lines</th>
          <th className="th" style={{textAlign:"right"}}>Cost/Serve</th>
          <th className="th" style={{textAlign:"right"}}>Suggested (excl. VAT)</th>
          <th className="th" style={{textAlign:"right"}}>Actual Price</th>
          <th className="th" style={{textAlign:"right"}}>Food Cost %</th>
          <th className="th"/>
        </tr></thead>
        <tbody>{filtered.map(m=><tr key={m.id} style={{cursor:"pointer"}} onClick={()=>goRecipe(m.id)}>
          <td className="td">
            <div style={{fontWeight:600,fontSize:12,color:"#166534"}}>{m.menu_id}</div>
            <div style={{fontWeight:500,fontSize:13}}>{m.name_en}</div>
            <div style={{fontSize:11,color:"#9ca3af"}}>{m.name_th}</div>
          </td>
          <td className="td"><CatBadge cat={m.category}/></td>
          <td className="td" style={{textAlign:"right"}}>{m.lineCount||0}</td>
          <td className="td" style={{textAlign:"right",fontWeight:600}}>{m.lineCount>0?fmtB(m.totalCost):"—"}</td>
          <td className="td" style={{textAlign:"right",fontWeight:600,color:"#166534"}}>{m.lineCount>0?fmtB(m.suggestExcl):"—"}</td>
          <td className="td" style={{textAlign:"right",fontWeight:600}}>{m.actual_price!==""&&m.actual_price!==null?fmtB(m.actual_price):"—"}</td>
          <td className="td" style={{textAlign:"right"}}><PctBadge pct={m.foodCostPct}/></td>
          <td className="td"><button onClick={e=>{e.stopPropagation();goRecipe(m.id);}} className="btn btn-o" style={{fontSize:11,padding:"3px 10px"}}>View →</button></td>
        </tr>)}</tbody>
      </table>
    </div>
  </div>;
}

/* ── App ─────────────────────────────── */
function App(){
  const{token,login,gisReady}=useAuth();
  const[menus,updMenus,,setMenuTok,,menuErr]=useSave("Menus",SHEETS.Menus,INITIAL_MENUS);
  const[ingredients,updIngr,,setIngrTok,,ingrErr]=useSave("Ingredients",SHEETS.Ingredients,[]);
  const[recipeLines,updLines,,setLineTok,,lineErr]=useSave("RecipeLines",SHEETS.RecipeLines,[]);
  const[cookingSteps,updSteps,,setStepTok,,stepErr]=useSave("CookingSteps",SHEETS.CookingSteps,[]);

  const saveError=menuErr||ingrErr||lineErr||stepErr;
  const[page,setPage]=useState("dashboard");
  const[selectedMenu,setSelectedMenu]=useState(null);

  useEffect(()=>{
    if(!token)return;
    setMenuTok(token);setIngrTok(token);setLineTok(token);setStepTok(token);
  },[token]);

  function navToRecipe(menuId){setSelectedMenu(menuId);setPage("recipe");}

  return <div style={{display:"flex",minHeight:"100vh"}}>
    <Sidebar page={page} setPage={setPage} token={token} onLogin={login} gisReady={gisReady} saveError={saveError}/>
    {page==="dashboard"&&<DashboardPage menus={menus} recipeLines={recipeLines} setSelectedMenu={setSelectedMenu} setPage={setPage}/>}
    {page==="menus"&&<MenusPage menus={menus} updateMenus={updMenus} setSelectedMenu={navToRecipe}/>}
    {page==="ingredients"&&<IngredientsPage ingredients={ingredients} updateIngredients={updIngr}/>}
    {page==="recipe"&&<RecipePage menuId={selectedMenu} menus={menus} updateMenus={updMenus}
      recipeLines={recipeLines} updateRecipeLines={updLines}
      cookingSteps={cookingSteps} updateCookingSteps={updSteps}
      ingredients={ingredients} onBack={()=>setPage("dashboard")}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
