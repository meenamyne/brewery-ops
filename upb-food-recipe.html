function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

function fmtB(n){const v=+n;if(!v&&v!==0)return"—";return"฿"+v.toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtP(n){if(n===null||n===undefined||n==="")return"—";return(+n*100).toFixed(1)+"%";}

function getCatStyle(cats,catName){
  const idx=cats.findIndex(c=>c.name===catName);
  const p=CAT_PRESETS[Math.max(0,idx)%CAT_PRESETS.length];
  const c=cats.find(c=>c.name===catName);
  return{bg:p.bg,tx:p.tx,icon:c?.icon||"🍽️"};
}

function calcMenuCost(menuId,recipeLines,menu){
  const lines=recipeLines.filter(r=>String(r.menu_id)===String(menuId));
  const rawCost=lines.reduce((s,l)=>s+parseFloat(l.ingredient_cost||0),0);
  const spice=parseFloat(menu?.spice_pct||0.10);
  const target=parseFloat(menu?.target_food_cost_pct||0.35);
  const price=parseFloat(menu?.actual_price||0);
  const serves=parseFloat(menu?.serves_per_recipe||1)||1;
  const totalCost=rawCost*(1+spice);       // total batch cost
  const costPerServe=totalCost/serves;     // cost per 1 serve/unit
  const suggestExcl=target>0?costPerServe/target:0;
  const suggestIncl=suggestExcl*1.07;
  const foodCostPct=price>0?costPerServe/price:null;
  return{rawCost,totalCost,costPerServe,suggestExcl,suggestIncl,foodCostPct,lineCount:lines.length};
}
function calcLineIngCost(ingredient,usageQty){
  const cpu=parseFloat(ingredient?.cost_per_unit||0);
  const yld=parseFloat(ingredient?.yield_pct||1);
  const qty=parseFloat(usageQty||0);
  if(yld<=0)return 0;
  return(cpu/yld)*qty;
}

  ws2["!cols"]=[{wch:22},{wch:55},{wch:38},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws2,"Instructions");
  XLSX.writeFile(wb,"UPB_Ingredient_Template.xlsx");
}

function parseIngredientExcel(file,onParsed){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:"array"});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
      if(!rows.length){onParsed([]);return;}
      const hdrs=rows[0].map(h=>String(h).trim().toLowerCase());
      const col=(names)=>{for(const n of names){const i=hdrs.indexOf(n);if(i>=0)return i;}return -1;};
      const ni=col(["name","ingredient","รายการ"]);
      if(ni===-1){onParsed(null);return;}
      const supi=col(["supplier","ซัพพลายเออร์"]);
      const cati=col(["ingr_category","category","หมวดหมู่"]);
      const ppi=col(["purchase_price","ราคาซื้อ","price"]);
      const pqi=col(["purchase_qty","ปริมาณซื้อ","qty","quantity"]);
      const uni=col(["unit","หน่วย"]);
      const vi=col(["vat"]);
      const yi=col(["yield_pct","yield"]);
      const di=col(["last_price_date","date","วันที่อัพเดทราคาล่าสุด"]);
      const oi=col(["notes","note","หมายเหตุ"]);
      const parsed=rows.slice(1)
        .filter(r=>r[ni]&&String(r[ni]).trim())
        .map(r=>{
          const pp=ppi>=0?parseFloat(r[ppi]||0)||0:0;
          const pq=pqi>=0?parseFloat(r[pqi]||1)||1:1;
          const cpu=pq>0?pp/pq:0;
          const vat=vi>=0?(String(r[vi]).toLowerCase()==="true"||r[vi]===true||r[vi]===1):false;
          return{
            id:uid(),
            name:String(r[ni]).trim(),
            supplier:supi>=0?String(r[supi]||"").trim():"",
            ingr_category:cati>=0?String(r[cati]||"").trim():"",
            purchase_price:pp,
            purchase_qty:pq,
            unit:uni>=0?String(r[uni]||"").trim():"",
            cost_per_unit:Math.round(cpu*10000)/10000,
            vat,
            yield_pct:yi>=0?(parseFloat(r[yi]||1)||1):1,
            last_price_date:di>=0?String(r[di]||"").trim():"",
            notes:oi>=0?String(r[oi]||"").trim():"",
          };
        });
      onParsed(parsed);
    }catch(err){onParsed(null);}
  };
  reader.readAsArrayBuffer(file);
}

/* ── Recipe Book parser (multi-sheet Excel) ── */
function parseRecipeBook(file,onParsed){
  const reader=new FileReader();
  reader.onload=(e)=>{
    try{
      const wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"});
      const results=[];
      for(const sheetName of wb.SheetNames){
        const ws=wb.Sheets[sheetName];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
        if(!rows.length)continue;
        // Scan first 10 rows for label→value pairs
        const findVal=(label,maxRow=10)=>{
          for(let r=0;r<Math.min(rows.length,maxRow);r++){
            for(let c=0;c<rows[r].length;c++){
              if(String(rows[r][c]||"").trim().replace(/\s+/g," ").includes(label)){
                for(let nc=c+1;nc<rows[r].length;nc++){
                  const v=String(rows[r][nc]||"").trim();
                  if(v)return v;
                }
              }
            }
          }
          return"";
        };
        const nameTh=findVal("ชื่อเมนู (ไทย)")||findVal("ชื่อเมนู(ไทย)");
        const nameEn=findVal("ชื่อเมนู (Eng)")||findVal("ชื่อเมนู(Eng)");
        const servesRaw=findVal("จำนวนเสิร์ฟต่อสูตร")||findVal("จำนวนเสิร์ฟ");
        const servesPerRecipe=Math.max(1,parseInt(String(servesRaw).replace(/[^0-9]/g,""))||1);
        // Find column-header row: the row containing exactly "วัตถุดิบ" as one of the cells
        let hdrRow=-1,ingCol=-1,pqCol=-1,puCol=-1,cpuCol=-1,yldCol=-1,uqCol=-1,uuCol=-1,icCol=-1;
        for(let r=5;r<Math.min(rows.length,25);r++){
          const row=rows[r];
          const idx=row.findIndex(c=>String(c||"").trim()==="วัตถุดิบ");
          if(idx>=0){
            hdrRow=r;ingCol=idx;
            row.forEach((cell,i)=>{
              const s=String(cell||"").trim();
              if(s.includes("ปริมาณซื้อ"))pqCol=i;
              if(s.includes("หน่วยซื้อ"))puCol=i;
              if(s.includes("ต้นทุนต่อหน่วย"))cpuCol=i;
              if(s.toLowerCase().includes("yield"))yldCol=i;
              if(s.includes("ปริมาณใช้"))uqCol=i;
              if(s.includes("หน่วยใช้"))uuCol=i;
              if(s.includes("ต้นทุนวัตถุดิบ"))icCol=i;
            });
            break;
          }
        }
        const lines=[];
        let stepsStartRow=-1; // will be set when we find the cooking steps header
        if(hdrRow>=0&&ingCol>=0){
          for(let r=hdrRow+1;r<rows.length;r++){
            const row=rows[r];
            // Check if this row is the cooking steps header before parsing as ingredient
            const rowText=row.map(c=>String(c||"").trim()).join(" ");
            if(rowText.includes("วิธีการปรุงอาหาร")){stepsStartRow=r+1;break;}
            const name=String(row[ingCol]||"").trim();
            if(!name)continue;
            const yRaw=String(row[yldCol]||"100%").replace(/[^0-9.]/g,"");
            const yNum=parseFloat(yRaw)||100;
            const yld=yNum>1?yNum/100:yNum;
            const uq=parseFloat(row[uqCol]||0)||0;
            const ic=parseFloat(row[icCol]||0)||0;
            if(uq===0&&ic===0)continue; // skip empty template rows
            lines.push({
              ingredient_name:name,
              purchase_qty:parseFloat(row[pqCol]||0)||0,
              purchase_unit:String(row[puCol]||"").trim(),
              cost_per_unit:parseFloat(row[cpuCol]||0)||0,
              yield_pct:yld,
              usage_qty:uq,
              usage_unit:uuCol>=0?String(row[uuCol]||"").trim():"",
              ingredient_cost:ic,
            });
          }
        }
        // If cooking header wasn't found in ingredient rows, scan the rest of the sheet
        if(stepsStartRow<0){
          for(let r=hdrRow>=0?hdrRow:0;r<rows.length;r++){
            const rowText=rows[r].map(c=>String(c||"").trim()).join(" ");
            if(rowText.includes("วิธีการปรุงอาหาร")){stepsStartRow=r+1;break;}
          }
        }
        // Parse cooking steps: col A = step number, col B (ingCol) = instruction text
        const steps=[];
        if(stepsStartRow>=0){
          for(let r=stepsStartRow;r<rows.length;r++){
            const row=rows[r];
            const stepNo=parseInt(String(row[0]||"").trim());
            if(!stepNo)continue; // skip blank or non-numbered rows
            // Instruction text: prefer ingCol column, fall back to first non-empty cell after col A
            let instr=String(row[ingCol>=0?ingCol:1]||"").trim();
            if(!instr){for(let c=1;c<row.length;c++){const v=String(row[c]||"").trim();if(v){instr=v;break;}}}
            if(!instr)continue;
            steps.push({step_no:stepNo,instruction:instr});
          }
        }
        if(lines.length>0||nameTh||steps.length>0){
          results.push({sheetName,name_th:nameTh||sheetName,name_en:nameEn,lines,steps,serves_per_recipe:servesPerRecipe});
        }
      }
      onParsed(results);
    }catch(err){onParsed(null);}
  };
  reader.readAsArrayBuffer(file);
}

/* ── Sheets helpers ── */
function gvizFetch(sid,sname){
  return new Promise((res,rej)=>{
    const cb="_gv_"+uid();
    const url=`https://docs.google.com/spreadsheets/d/${sid}/gviz/tq?tqx=out:json&tq=select+*&sheet=${encodeURIComponent(sname)}&cb=${cb}`;
    window[cb]=(d)=>{delete window[cb];document.head.removeChild(s);res(d);};
    const s=document.createElement("script");s.src=url;
    s.onerror=()=>{delete window[cb];rej(new Error("gviz fail"));};
    document.head.appendChild(s);
    setTimeout(()=>{if(window[cb]){delete window[cb];rej(new Error("timeout"));}},10000);
  });
}
async function sheetsRead(sid,sname){
  try{
    const raw=await gvizFetch(sid,sname);
    const cols=(raw.table?.cols||[]).map(c=>c.label||c.id||"");
    const rows=(raw.table?.rows||[]).map(r=>{const o={};(r.c||[]).forEach((c,i)=>{o[cols[i]]=c?.v??c?.f??"";});return o;});
    return rows.filter(r=>Object.values(r).some(v=>v!==null&&v!==""));
  }catch(e){return null;}
}
async function sheetsApiRead(tok,sid,tab){
  try{
    const r=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(tab)}`,{headers:{"Authorization":"Bearer "+tok}});
    if(!r.ok)return null; // tab missing or auth error
    const j=await r.json();const vals=j.values||[];
    if(vals.length<2)return []; // tab exists but empty/header-only → don't trigger re-save loop
    const h=vals[0];
    return vals.slice(1).map(row=>{const o={};h.forEach((k,i)=>{o[k]=row[i]??"";});return o;}).filter(r=>Object.values(r).some(v=>v!==""));
  }catch(e){return null;}
}
async function sheetsApiWrite(tok,sid,tab,headers,rows){
  const drows=rows.map(r=>headers.map(h=>{const v=r[h];return v==null?"":String(v);}));
  const empty=headers.map(()=>"");
  const PAD=Math.max(500,drows.length+50);
  for(let i=drows.length;i<PAD;i++)drows.push(empty);
  const range=`${tab}!A1`;
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,{
    method:"PUT",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
    body:JSON.stringify({range,majorDimension:"ROWS",values:[headers,...drows]})
  });
}
async function sheetsEnsure(tok,sid,tab,headers){
  const meta=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}?fields=sheets.properties.title`,
    {headers:{"Authorization":"Bearer "+tok}}).then(r=>r.json());
  const exists=(meta.sheets||[]).some(s=>s.properties.title===tab);
  if(!exists){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${sid}:batchUpdate`,{
      method:"POST",headers:{"Authorization":"Bearer "+tok,"Content-Type":"application/json"},
      body:JSON.stringify({requests:[{addSheet:{properties:{title:tab}}}]})
    });
    await sheetsApiWrite(tok,sid,tab,headers,[]);
  }
}

/* ── useAuth ── */
const _KEY="upb_food_hint";let _rt=null;
function useAuth(){
  const[token,setToken]=useState(null);
  const[gisReady,setGisReady]=useState(false);
  const cRef=useRef(null);
  useEffect(()=>{const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.async=true;s.onload=()=>setGisReady(true);document.head.appendChild(s);},[]);
  const schedRefresh=useCallback(()=>{
    if(_rt)clearTimeout(_rt);
    _rt=setTimeout(()=>{if(!cRef.current)return;cRef.current.requestAccessToken({prompt:"",login_hint:localStorage.getItem(_KEY)||""});},55*60*1000);
  },[]);
  const initClient=useCallback(()=>{
    if(!gisReady||cRef.current)return;
    cRef.current=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,scope:SCOPES,
      callback:(resp)=>{
        if(resp.access_token){
          setToken(resp.access_token);schedRefresh();
          try{const p=JSON.parse(atob(resp.access_token.split(".")[1]||"e30="));if(p.email)localStorage.setItem(_KEY,p.email);}catch(e){}
        }
      }
    });
  },[gisReady,schedRefresh]);
  useEffect(()=>{initClient();},[initClient]);
  const login=useCallback(()=>{if(cRef.current)cRef.current.requestAccessToken();},[]);
  return{token,login,gisReady};
}

/* ── useSave ── */
function dedup(rows,pk){const m=new Map();rows.forEach(r=>{if(r[pk]!==undefined&&r[pk]!=="")m.set(r[pk],r);});return[...m.values()];}
function useSave(tabName,headers,initial){
  const[data,setData]=useState(initial);
  const[saveError,setSaveError]=useState(false);
  const[loaded,setLoaded]=useState(false); // true once Sheets data has been fetched
  const tRef=useRef(null);const dirtyRef=useRef(false);const[saveVer,setSaveVer]=useState(0);const alRef=useRef(false);
  const setToken=useCallback((t)=>{
    tRef.current=t;
    dirtyRef.current=false; // reset dirty on fresh token so Sheets data always wins on login
    sheetsApiRead(t,SPREADSHEET_ID,tabName).then(rows=>{
      alRef.current=true;
      setLoaded(true);
      if(rows===null){
        // Tab doesn't exist yet — trigger a save to create it
        dirtyRef.current=true;setSaveVer(v=>v+1);
      } else if(rows.length>0){
        // Tab has data — load it
        if(!dirtyRef.current)setData(dedup(rows,headers[0]));
      }
      // rows===[] means tab exists but empty — nothing to do, no loop
    });
  },[tabName,headers]);
  useEffect(()=>{
    sheetsRead(SPREADSHEET_ID,tabName).then(rows=>{
      if(rows&&rows.length>0&&!alRef.current&&!tRef.current)setData(dedup(rows,headers[0]));
    }).catch(()=>{});
  },[tabName,headers]);
  useEffect(()=>{
    if(!dirtyRef.current||!tRef.current)return;
    const t=setTimeout(async()=>{
      if(!dirtyRef.current)return;
      try{
        await sheetsEnsure(tRef.current,SPREADSHEET_ID,tabName,headers);
        await sheetsApiWrite(tRef.current,SPREADSHEET_ID,tabName,headers,data);
        dirtyRef.current=false;setSaveError(false);
      }catch(e){setSaveError(true);}
    },1200);
    return()=>clearTimeout(t);
  },[data,saveVer,tabName,headers]);
  const update=useCallback((fn)=>{setData(fn);dirtyRef.current=true;setSaveVer(v=>v+1);},[]);
  const forcePush=useCallback(()=>{if(tRef.current){dirtyRef.current=true;setSaveVer(v=>v+1);}},[]);
  return[data,update,setToken,forcePush,saveError,loaded];
}

/* ── EditMenuModal ── */
const PC_CATEGORY="Sauces & Prep";
const CAT_PREFIX_MAP={
  "Appetizer":"AP","Main Dish":"MD","Salad & Yum":"SL","Salad":"SL",
  "Dessert":"DS","Drink":"DR","Beer":"BR","Soup":"SO","Snack":"SN",
  "Sauces & Prep":"AS", // regular menus; pre-cooked always uses "PC" via isPC flag
};
function catToPrefix(cat){
  if(CAT_PREFIX_MAP[cat])return CAT_PREFIX_MAP[cat];
  const words=cat.trim().split(/\s+/);
  if(words.length>=2)return(words[0][0]+words[1][0]).toUpperCase();
  return cat.slice(0,2).toUpperCase();
}
function genMenuId(cat,menus,isPC){
  const prefix=isPC?"PC":catToPrefix(cat);
  const nums=menus.filter(m=>m.menu_id&&m.menu_id.toUpperCase().startsWith(prefix+"_"))
    .map(m=>parseInt(m.menu_id.split("_")[1])||0);
  const next=nums.length?Math.max(...nums)+1:1;
  return`${prefix}_${String(next).padStart(2,"0")}`;
}

function EditMenuModal({open,onClose,menu,onSave,menus}){
  const cats=useContext(CatsCtx);
  const mkBlank=(type,cat)=>{
    const isPC=type==="precooked";
    const category=isPC?PC_CATEGORY:(cat||cats[0]?.name||"Appetizer");
    return{menu_id:genMenuId(category,menus||[],isPC),category,name_th:"",name_en:"",
      serves_per_recipe:1,batch_unit:"Gram",spice_pct:0.10,target_food_cost_pct:0.35,actual_price:"",checked:false,menu_type:type||"menu"};
  };
  const[f,setF]=useState(()=>mkBlank("menu"));
  useEffect(()=>{
    if(menu){setF({...menu,menu_type:menu.menu_type||"menu"});}
    else{setF(mkBlank("menu"));}
  },[open,menu]);
  const ch=(k,v)=>setF(p=>({...p,[k]:v}));
  const isPC=f.menu_type==="precooked";
  const isNew=!menu;

  function handleTypeChange(newType){
    const pc=newType==="precooked";
    const cat=pc?PC_CATEGORY:(cats[0]?.name||"Appetizer");
    setF(p=>({...p,menu_type:newType,category:cat,
      menu_id:isNew?genMenuId(cat,menus||[],pc):p.menu_id}));
  }
  function handleCatChange(cat){
    setF(p=>({...p,category:cat,
      menu_id:isNew?genMenuId(cat,menus||[],false):p.menu_id}));
  }

  function save(){
    if(!f.menu_id||!f.name_en)return;
    onSave({...f,id:f.id||f.menu_id,serves_per_recipe:+f.serves_per_recipe||1,
      batch_unit:isPC?(f.batch_unit||"Gram"):undefined,
      spice_pct:+f.spice_pct||0.10,
      target_food_cost_pct:+f.target_food_cost_pct||0.35,
      actual_price:isPC?"":f.actual_price===""?"":+f.actual_price,
      checked:toBool(f.checked),menu_type:f.menu_type||"menu"});
    onClose();
  }
  return <Modal open={open} onClose={onClose} title={menu?"Edit Menu":"Add New Menu"} wide>
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      {[["menu","🍽️ Regular Menu"],["precooked","🍳 Pre-Cooked Ingredient"]].map(([val,label])=>
        <button key={val} onClick={()=>handleTypeChange(val)} className="btn"
          style={{flex:1,justifyContent:"center",background:f.menu_type===val?"#166534":"#f1f5f9",color:f.menu_type===val?"#fff":"#374151",fontSize:13}}>
          {label}
        </button>
      )}
    </div>
    {isPC&&<div style={{background:"#fef3c7",border:"1px solid #fcd34d",borderRadius:10,padding:"10px 14px",marginBottom:14,fontSize:13,color:"#92400e",lineHeight:1.6}}>
      🍳 This recipe produces a batch ingredient. Set <strong>Batch Output</strong> (e.g. 1000 Gram) — the total amount one cook produces. Cost per unit (฿/Gram) is auto-calculated and pushed to the Ingredients master list so other menus can pick it up by weight.
    </div>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      <div><label className="fl">Menu ID *</label>
        <input className="inp" value={f.menu_id} onChange={e=>ch("menu_id",e.target.value)}
          style={isNew?{background:"#f0fdf4"}:{}}
          placeholder={isPC?"e.g. PC_01":"e.g. AP_31"}/>
        {isNew&&<div style={{fontSize:10,color:"#6b7280",marginTop:2}}>Auto-generated · you can edit if needed</div>}
      </div>
      <div><label className="fl">{isPC?"Category (fixed)":"Category *"}</label>
        {isPC
          ?<div className="inp" style={{background:"#fef3c7",color:"#92400e",fontWeight:600,cursor:"default"}}>🍳 {PC_CATEGORY}</div>
          :<select className="inp" value={f.category} onChange={e=>handleCatChange(e.target.value)}>
            {cats.map(c=><option key={c.id}>{c.name}</option>)}
          </select>
        }
      </div>
      <div><label className="fl">EN Name *</label><input className="inp" value={f.name_en} onChange={e=>ch("name_en",e.target.value)} placeholder={isPC?"e.g. Steak Sauce":""}/></div>
      <div><label className="fl">Thai Name</label><input className="inp" value={f.name_th} onChange={e=>ch("name_th",e.target.value)}/></div>
      <div><label className="fl">{isPC?"Batch Output (ปริมาณต่อสูตร)":"Serves per Recipe"}</label>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          <input className="inp" type="number" min="1" value={f.serves_per_recipe} onChange={e=>ch("serves_per_recipe",e.target.value)} placeholder={isPC?"e.g. 1000":""} style={{flex:1}}/>
          {isPC&&<select className="inp" value={f.batch_unit||"Gram"} onChange={e=>ch("batch_unit",e.target.value)} style={{width:90,flexShrink:0}}>
            {["Gram","ml","Piece","kg","L","tbsp","tsp","cup"].map(u=><option key={u}>{u}</option>)}
          </select>}
        </div>
        {isPC&&<div style={{fontSize:11,color:"#6b7280",marginTop:3}}>1 batch → {f.serves_per_recipe||1} {f.batch_unit||"Gram"} pushed to Ingredients as cost/{f.batch_unit||"Gram"}</div>}
      </div>
      {!isPC&&<div><label className="fl">Actual Selling Price (฿)</label><input className="inp" type="number" min="0" value={f.actual_price} onChange={e=>ch("actual_price",e.target.value)}/></div>}
      <div><label className="fl">Spice Allowance (%)</label>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <input className="inp" type="number" step="1" min="0" max="100" value={Math.round((+f.spice_pct||0.10)*100)} onChange={e=>ch("spice_pct",+e.target.value/100)} style={{width:65}}/><span style={{fontSize:13}}>%</span>
        </div>
      </div>
      {!isPC&&<div><label className="fl">Target Food Cost (%)</label>
        <div style={{display:"flex",alignItems:"center",gap:5}}>
          <input className="inp" type="number" step="1" min="1" max="100" value={Math.round((+f.target_food_cost_pct||0.35)*100)} onChange={e=>ch("target_food_cost_pct",+e.target.value/100)} style={{width:65}}/><span style={{fontSize:13}}>%</span>
        </div>
      </div>}
    </div>
    <div style={{display:"flex",alignItems:"center",gap:8,margin:"14px 0"}}>
      <input type="checkbox" id="chk" checked={toBool(f.checked)} onChange={e=>ch("checked",e.target.checked)}/>
      <label htmlFor="chk" style={{fontSize:13,color:"#374151"}}>Recipe verified / checked</label>
    </div>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:16}}>
      <button onClick={onClose} className="btn btn-o">Cancel</button>
      <button onClick={save} className="btn btn-g">Save Menu</button>
    </div>
  </Modal>;
}

/* ── Recipe Print helpers ── */
function escH(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

function buildPrintHTML(selectedMenus,recipeLines,ingredients,cookingSteps){
  const now=new Date().toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"});
  const summaryRows=selectedMenus.map((m,idx)=>{
    const c=calcMenuCost(m.id,recipeLines,m);
    return`<tr>
      <td>${idx+1}</td>
      <td style="font-weight:700;color:#166534">${escH(m.menu_id)}</td>
      <td><div style="font-weight:600">${escH(m.name_en)}</div><div style="font-size:10pt;color:#6b7280">${escH(m.name_th)}</div></td>
      <td>${escH(m.category)}</td>
      <td class="r">${m.serves_per_recipe||1}</td>
      <td class="r">${c.costPerServe>0?"฿"+c.costPerServe.toFixed(2):"—"}</td>
      <td class="r" style="color:#166534;font-weight:700">${c.suggestIncl>0?"฿"+c.suggestIncl.toFixed(2):"—"}</td>
    </tr>`;
  }).join("");
  const recipePages=selectedMenus.map(m=>{
    const lines=recipeLines.filter(r=>String(r.menu_id)===String(m.id));
    const steps=(cookingSteps||[]).filter(s=>String(s.menu_id)===String(m.id)).sort((a,b)=>a.step_no-b.step_no);
    const c=calcMenuCost(m.id,recipeLines,m);
    const serves=m.serves_per_recipe||1;
    const ingRows=lines.map((l,i)=>{
      return`<tr>
        <td style="text-align:center;color:#9ca3af">${i+1}</td>
        <td>${escH(l.ingredient_name||"")}</td>
        <td class="r">${l.usage_qty||0}</td>
        <td style="color:#6b7280">${escH(l.usage_unit||"")}</td>
        <td class="r">฿${(+l.ingredient_cost||0).toFixed(2)}</td>
      </tr>`;
    }).join("")||`<tr><td colspan="5" style="text-align:center;padding:12px;color:#9ca3af">No ingredients added yet</td></tr>`;
    const stepsHtml=steps.length?`<div class="section">
      <div class="section-title">วิธีการปรุงอาหาร / Cooking Steps</div>
      <ol class="steps">${steps.map(s=>`<li>${escH(s.instruction)}</li>`).join("")}</ol>
    </div>`:"";
    return`<div class="page">
      <div class="recipe-header">
        <div class="recipe-id">${escH(m.menu_id)}</div>
        <div class="recipe-title">${escH(m.name_en)}</div>
        ${m.name_th?`<div class="recipe-title-th">${escH(m.name_th)}</div>`:""}
      </div>
      <div class="info-row">
        <div class="info-box"><div class="info-label">Category</div><div class="info-val">${escH(m.category)}</div></div>
        <div class="info-box"><div class="info-label">Batch Yield</div><div class="info-val">${serves} serves</div></div>
        <div class="info-box"><div class="info-label">Spice & Misc</div><div class="info-val">${Math.round((+m.spice_pct||0.1)*100)}%</div></div>
        <div class="info-box"><div class="info-label">Target Food Cost</div><div class="info-val">${Math.round((+m.target_food_cost_pct||0.35)*100)}%</div></div>
        ${m.actual_price!==""&&m.actual_price!==null&&m.actual_price!==undefined?`<div class="info-box"><div class="info-label">Selling Price</div><div class="info-val" style="color:#166534">฿${(+m.actual_price).toFixed(0)}</div></div>`:""}
      </div>
      <div class="section">
        <div class="section-title">วัตถุดิบ / Ingredients (${lines.length} items)</div>
        <table class="ingr-table">
          <thead><tr><th>#</th><th>วัตถุดิบ / Ingredient</th><th class="r">ปริมาณ</th><th>หน่วย</th><th class="r">ต้นทุน (฿)</th></tr></thead>
          <tbody>${ingRows}</tbody>
          <tfoot>
            <tr><td colspan="3"></td><td>รวม / Total</td><td class="r">฿${(c.rawCost||0).toFixed(2)}</td></tr>
            <tr><td colspan="3"></td><td>Spice & Misc</td><td class="r">฿${((c.totalCost||0)-(c.rawCost||0)).toFixed(2)}</td></tr>
            <tr class="ft-total"><td colspan="3"></td><td>ต้นทุน/สูตร</td><td class="r">฿${(c.totalCost||0).toFixed(2)}</td></tr>
            <tr class="ft-serve"><td colspan="3"></td><td>ต้นทุน/เสิร์ฟ</td><td class="r">฿${(c.costPerServe||0).toFixed(2)}</td></tr>
            ${c.suggestIncl>0?`<tr class="ft-sugg"><td colspan="3"></td><td>ราคาแนะนำ (incl. VAT)</td><td class="r">฿${c.suggestIncl.toFixed(2)}</td></tr>`:""}
          </tfoot>
        </table>
      </div>
      ${stepsHtml}
    </div>`;
  }).join("");
  return`<!DOCTYPE html><html lang="th"><head><meta charset="UTF-8">

<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">

/* ── PrintRecipesModal ── */
function PrintRecipesModal({open,onClose,menus,recipeLines,ingredients,cookingSteps}){
  const cats=useContext(CatsCtx);
  const[mode,setMode]=useState("category");
  const[selCat,setSelCat]=useState("All");
  const[selIds,setSelIds]=useState(new Set());
  const[printing,setPrinting]=useState(false);
  const selectedMenus=useMemo(()=>{
    if(mode==="category")return menus.filter(m=>selCat==="All"||(m.category===selCat&&m.menu_type!=="precooked"));
    return menus.filter(m=>selIds.has(m.id));
  },[mode,menus,selCat,selIds]);
  function toggleId(id){setSelIds(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});}
  function toggleAll(ids){
    const allSel=ids.every(id=>selIds.has(id));
    setSelIds(prev=>{const n=new Set(prev);ids.forEach(id=>allSel?n.delete(id):n.add(id));return n;});
  }
  function doPrint(){
    if(!selectedMenus.length)return;
    setPrinting(true);
    const html=buildPrintHTML(selectedMenus,recipeLines,ingredients,cookingSteps);
    const win=window.open("","_blank");
    if(!win){alert("Please allow pop-ups for this page.");setPrinting(false);return;}
    win.document.write(html);
    win.document.close();
    win.focus();
    setTimeout(()=>{win.print();setPrinting(false);},900);
  }
  const foodMenus=useMemo(()=>menus.filter(m=>m.menu_type!=="precooked"),[menus]);
  const catGroups=useMemo(()=>{
    const map={};
    foodMenus.forEach(m=>{if(!map[m.category])map[m.category]=[];map[m.category].push(m);});
    return map;
  },[foodMenus]);
  if(!open)return null;

            onClick={()=>toggleId(m.id)}>
            <input type="checkbox" checked={selIds.has(m.id)} onChange={()=>{}} style={{cursor:"pointer"}}/>
            <span style={{fontSize:11,fontWeight:600,color:"#166534",minWidth:48}}>{m.menu_id}</span>

        <span style={{fontWeight:700,color:"#166534",fontSize:15}}>{selectedMenus.length}</span> recipe{selectedMenus.length!==1?"s":""} selected
        {selectedMenus.length>0&&<span style={{marginLeft:8,fontSize:11}}>· 1 summary page + {selectedMenus.length} recipe page{selectedMenus.length!==1?"s":""}</span>}
      </div>

}

/* ── MenusPage ── */
function menuStatus(m,recipeLines){
  const lc=recipeLines.filter(r=>String(r.menu_id)===String(m.id)).length;
  if(lc>0&&toBool(m.checked))return"verified";
  if(lc>0)return"has_recipe";
  return"draft";
}
function StatusBadge({status}){
  if(status==="verified")return<span className="badge" style={{background:"#dcfce7",color:"#166534",whiteSpace:"nowrap"}}>✓ Verified</span>;
  if(status==="has_recipe")return<span className="badge" style={{background:"#dbeafe",color:"#1e40af",whiteSpace:"nowrap"}}>📖 Has Recipe</span>;
  return<span className="badge" style={{background:"#f3f4f6",color:"#6b7280",whiteSpace:"nowrap"}}>⬜ Draft</span>;
}
function MenusPage({menus,updateMenus,setSelectedMenu,ingredients,updateIngredients,updateRecipeLines,updateCookingSteps,recipeLines,cookingSteps,menuCat,setMenuCat}){
  const cats=useContext(CatsCtx);
  const[search,setSearch]=useState("");
  const[statusFilter,setStatusFilter]=useState("All");
  const[editM,setEditM]=useState(null);
  const[showAdd,setShowAdd]=useState(false);
  const[delId,setDelId]=useState(null);
  const[dupSrc,setDupSrc]=useState(null); // menu being duplicated
  const[dupName,setDupName]=useState("");
  const[actionOpen,setActionOpen]=useState(null); // id of row whose dropdown is open
  const[dropPos,setDropPos]=useState({top:0,right:0});
  useEffect(()=>{if(!actionOpen)return;const h=()=>setActionOpen(null);document.addEventListener("click",h);return()=>document.removeEventListener("click",h);},[actionOpen]);
  const[showRecipeUpload,setShowRecipeUpload]=useState(false);
  const[showPrint,setShowPrint]=useState(false);
  const enriched=useMemo(()=>menus.map(m=>{
    const c=calcMenuCost(m.id,recipeLines,m);
    return{...m,status:menuStatus(m,recipeLines),...c};
  }),[menus,recipeLines]);
  const filtered=useMemo(()=>enriched.filter(m=>{
    if(menuCat!=="All"&&m.category!==menuCat)return false;
    if(statusFilter!=="All"&&m.status!==statusFilter)return false;
    if(search){const s=search.toLowerCase();return m.name_en?.toLowerCase().includes(s)||m.name_th?.includes(search)||m.menu_id?.toLowerCase().includes(s);}
    return true;
  }),[enriched,menuCat,statusFilter,search]);
  function saveMenu(m){updateMenus(prev=>{const i=prev.findIndex(x=>x.id===m.id);if(i>=0){const n=[...prev];n[i]=m;return n;}return[...prev,m];});}
  function delMenu(id){updateMenus(prev=>prev.filter(m=>m.id!==id));setDelId(null);}
  function startDup(m){setDupSrc(m);setDupName((m.name_en||m.name_th||"")+" (Copy)");}
  function doDuplicate(){
    if(!dupSrc||!dupName.trim())return;
    const isPC=dupSrc.menu_type==="precooked";
    const newId=genMenuId(dupSrc.category,menus,isPC);
    const newMenu={...dupSrc,id:uid(),menu_id:newId,name_en:dupName.trim(),checked:false};
    updateMenus(prev=>[...prev,newMenu]);
    setDupSrc(null);setDupName("");
  }
  const statusCounts=useMemo(()=>({
    verified:enriched.filter(m=>m.status==="verified").length,
    has_recipe:enriched.filter(m=>m.status==="has_recipe").length,
    draft:enriched.filter(m=>m.status==="draft").length,
  }),[enriched]);
  return <div style={{flex:1,padding:"28px 32px",overflowY:"auto"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
      <div><h2 style={{fontSize:22,fontWeight:700,margin:0}}>All Menus</h2>
        <div style={{fontSize:13,color:"#6b7280",marginTop:2}}>{menus.length} items · {filtered.length} shown</div></div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setShowPrint(true)} className="btn" style={{background:"#7c3aed",color:"#fff"}}>🖨️ Print PDF</button>
        <button onClick={()=>setShowRecipeUpload(true)} className="btn btn-b">📤 Upload Recipe Book</button>
        <button onClick={()=>setShowAdd(true)} className="btn btn-g">+ Add Menu</button>
      </div>
    </div>
    {/* Category filter */}
    <div style={{display:"flex",gap:6,marginBottom:8,flexWrap:"wrap"}}>
      {["All",...cats.map(c=>c.name)].map(c=><button key={c} onClick={()=>setMenuCat(c)} className="btn"
        style={{fontSize:12,padding:"5px 12px",background:menuCat===c?"#166534":"#f1f5f9",color:menuCat===c?"#fff":"#374151"}}>{c}</button>)}
    </div>
    {/* Status filter + search */}
    <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
      {[["All","All"],["draft","⬜ Draft"],["has_recipe","📖 Has Recipe"],["verified","✓ Verified"]].map(([k,label])=>{
        const count=k==="All"?enriched.length:statusCounts[k];
        return<button key={k} onClick={()=>setStatusFilter(k)} className="btn"
          style={{fontSize:12,padding:"5px 12px",background:statusFilter===k?"#1d4ed8":"#f1f5f9",color:statusFilter===k?"#fff":"#374151"}}>
          {label} <span style={{opacity:.7,marginLeft:3}}>({count})</span>
        </button>;
      })}
      <input className="inp" placeholder="Search…" value={search} onChange={e=>setSearch(e.target.value)} style={{width:190,marginLeft:"auto"}}/>
    </div>
    <div className="card" style={{overflow:"hidden"}}>
      <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
        <colgroup>
          <col style={{width:72}}/>{/* ID */}
          <col/>{/* Menu Name — flexible */}
          <col style={{width:140}}/>{/* Category */}
          <col style={{width:100}}/>{/* Cost/Batch */}
          <col style={{width:100}}/>{/* Cost/Serve */}
          <col style={{width:100}}/>{/* Actual Price */}
          <col style={{width:120}}/>{/* Suggested */}
          <col style={{width:110}}/>{/* Status */}
          <col style={{width:140}}/>{/* Actions */}
        </colgroup>
        <thead><tr>
          <th className="th">ID</th><th className="th">Menu Name</th><th className="th">Category</th>
          <th className="th" style={{textAlign:"right"}}>Cost/Batch</th>
          <th className="th" style={{textAlign:"right"}}>Cost/Serve</th>
          <th className="th" style={{textAlign:"right"}}>Actual Price</th>
          <th className="th" style={{textAlign:"right"}}>Suggested (incl. VAT)</th>
          <th className="th">Status</th><th className="th">Actions</th>
        </tr></thead>
        <tbody>{filtered.map(m=>{
          const isPC=m.menu_type==="precooked";
          const hasLines=m.lineCount>0;
          return<tr key={m.id}>
            <td className="td" style={{fontWeight:600,color:"#166534",fontSize:12}}>{m.menu_id}</td>
            <td className="td"><div style={{fontWeight:500}}>{m.name_en}</div><div style={{fontSize:11,color:"#9ca3af"}}>{m.name_th}</div></td>
            <td className="td">{isPC?<span className="badge" style={{background:"#fef3c7",color:"#92400e",whiteSpace:"nowrap"}}>🍳 Pre-Cooked</span>:<CatBadge cat={m.category}/>}</td>
            <td className="td" style={{textAlign:"right",fontWeight:600,color:"#374151"}}>
              {isPC?(hasLines?fmtB(m.totalCost):"—"):"—"}
            </td>
            <td className="td" style={{textAlign:"right",fontWeight:600,color:isPC?"#92400e":"#374151"}}>
              {hasLines?fmtB(m.costPerServe):"—"}
            </td>
            <td className="td" style={{textAlign:"right",fontWeight:600}}>
              {isPC?<span style={{color:"#9ca3af",fontSize:12}}>auto-calc</span>:m.actual_price!==""&&m.actual_price!==null?fmtB(m.actual_price):"—"}
            </td>
            <td className="td" style={{textAlign:"right",fontWeight:600,color:"#166534"}}>
              {isPC?"—":hasLines?fmtB(m.suggestIncl):"—"}
            </td>
            <td className="td"><StatusBadge status={m.status}/></td>
            <td className="td"><div style={{display:"flex",gap:6,alignItems:"center",position:"relative"}}>
              <button onClick={()=>setSelectedMenu(m.id)} className="btn btn-o" style={{fontSize:12,padding:"4px 10px",whiteSpace:"nowrap"}}>📖 Recipe</button>
              <div style={{position:"relative"}}>
                <button onClick={e=>{e.stopPropagation();const r=e.currentTarget.getBoundingClientRect();setDropPos({top:r.bottom+4,right:window.innerWidth-r.right});setActionOpen(actionOpen===m.id?null:m.id);}}
                  className="btn btn-o" style={{fontSize:13,padding:"4px 10px",minWidth:32}} title="Actions">✏️</button>
              </div>
            </div></td>
          </tr>;
        })}</tbody>
      </table>
    </div>
    <EditMenuModal open={showAdd||!!editM} onClose={()=>{setShowAdd(false);setEditM(null);}} menu={editM} onSave={saveMenu} menus={menus}/>
    <PrintRecipesModal open={showPrint} onClose={()=>setShowPrint(false)}
      menus={menus} recipeLines={recipeLines} ingredients={ingredients} cookingSteps={cookingSteps}/>
    <UploadRecipeBookModal open={showRecipeUpload} onClose={()=>setShowRecipeUpload(false)}
      menus={menus} updateMenus={updateMenus} ingredients={ingredients} updateIngredients={updateIngredients} updateRecipeLines={updateRecipeLines} updateCookingSteps={updateCookingSteps}/>
    {dupSrc&&<div className="ov"><div className="mb" style={{maxWidth:420}}>
      <h3 style={{fontSize:16,fontWeight:700,margin:"0 0 4px"}}>Duplicate Menu</h3>
      <p style={{fontSize:13,color:"#6b7280",margin:"0 0 16px"}}>Copying <strong>{dupSrc.menu_id}</strong> · A new ID will be auto-assigned.</p>
      <label className="fl">New Menu Name (English)</label>
      <input className="inp" value={dupName} onChange={e=>setDupName(e.target.value)}
        onKeyDown={e=>e.key==="Enter"&&doDuplicate()} autoFocus style={{marginBottom:16}}/>
      <div style={{fontSize:12,color:"#9ca3af",marginBottom:16}}>
        New ID: <strong style={{color:"#166534"}}>{genMenuId(dupSrc.category,menus,dupSrc.menu_type==="precooked")}</strong>
        · Category: {dupSrc.category} · Same pricing &amp; settings, status reset to Draft
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={()=>{setDupSrc(null);setDupName("");}} className="btn btn-o">Cancel</button>
        <button onClick={doDuplicate} disabled={!dupName.trim()} className="btn btn-g">⧉ Duplicate</button>
      </div>
    </div></div>}
    {delId&&<div className="ov"><div className="mb" style={{maxWidth:380}}>
      <h3 style={{fontSize:16,fontWeight:700,margin:"0 0 8px"}}>Delete Menu?</h3>
      <p style={{fontSize:13,color:"#6b7280",marginBottom:20}}>This cannot be undone.</p>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={()=>setDelId(null)} className="btn btn-o">Cancel</button>
        <button onClick={()=>delMenu(delId)} className="btn btn-r">Delete</button>
      </div>
    </div></div>}
    {/* Action dropdown — rendered fixed so it escapes overflow:hidden on the card */}
    {actionOpen&&(()=>{const m=filtered.find(x=>x.id===actionOpen);if(!m)return null;return(
      <div onClick={e=>e.stopPropagation()}
        style={{position:"fixed",top:dropPos.top,right:dropPos.right,background:"#fff",border:"1px solid #e5e7eb",
          borderRadius:8,boxShadow:"0 6px 24px rgba(0,0,0,.18)",zIndex:9999,minWidth:150,overflow:"hidden"}}>
        <button onClick={()=>{setEditM(m);setActionOpen(null);}}
          style={{display:"block",width:"100%",textAlign:"left",padding:"10px 16px",border:"none",background:"none",fontSize:13,cursor:"pointer",color:"#374151"}}
          onMouseEnter={e=>e.currentTarget.style.background="#f1f5f9"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
          ✏️ Edit
        </button>
        <button onClick={()=>{startDup(m);setActionOpen(null);}}
          style={{display:"block",width:"100%",textAlign:"left",padding:"10px 16px",border:"none",background:"none",fontSize:13,cursor:"pointer",color:"#6d28d9"}}
          onMouseEnter={e=>e.currentTarget.style.background="#f5f3ff"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
          ⧉ Duplicate
        </button>
        <div style={{borderTop:"1px solid #f1f5f9"}}/>
        <button onClick={()=>{setDelId(m.id);setActionOpen(null);}}
          style={{display:"block",width:"100%",textAlign:"left",padding:"10px 16px",border:"none",background:"none",fontSize:13,cursor:"pointer",color:"#991b1b"}}
          onMouseEnter={e=>e.currentTarget.style.background="#fee2e2"} onMouseLeave={e=>e.currentTarget.style.background="none"}>
          🗑 Delete
        </button>
      </div>
    );})()}
  </div>;
}

/* ── EditIngredientModal ── */
function EditIngredientModal({open,onClose,ingr,onSave}){
  const ingrCats=useContext(IngrCatsCtx);
  const blank={name:"",supplier:"",ingr_category:"",purchase_price:"",purchase_qty:"",unit:"",vat:false,yield_pct:1,last_price_date:"",notes:""};
  const[f,setF]=useState(blank);
  useEffect(()=>{setF(ingr?{...ingr}:blank);},[open,ingr]);
  const ch=(k,v)=>setF(p=>({...p,[k]:v}));
  const pp=parseFloat(f.purchase_price||0)||0;
  const pq=parseFloat(f.purchase_qty||1)||1;
  const cpu=pq>0?Math.round(pp/pq*10000)/10000:0;
  function save(){
    if(!f.name)return;
    onSave({...f,id:f.id||uid(),purchase_price:pp,purchase_qty:pq,
      cost_per_unit:cpu,vat:!!f.vat,yield_pct:+f.yield_pct||1});
    onClose();
  }
  return <Modal open={open} onClose={onClose} title={ingr?"Edit Ingredient":"Add Ingredient"} wide>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
      {/* Row 1: Supplier | Name */}
      <div><label className="fl">Supplier</label><input className="inp" value={f.supplier} onChange={e=>ch("supplier",e.target.value)} placeholder="Makro, Food Project…"/></div>
      <div><label className="fl">Ingredient Name * (EN / TH)</label><input className="inp" value={f.name} onChange={e=>ch("name",e.target.value)} placeholder="e.g. Chicken Breast / อกไก่"/></div>
      {/* Row 2: Purchase Price | Purchase Qty */}
      <div><label className="fl">Purchase Price (฿)</label><input className="inp" type="number" min="0" step="0.01" value={f.purchase_price} onChange={e=>ch("purchase_price",e.target.value)} placeholder="Total price paid"/></div>
      <div><label className="fl">Purchase Qty</label><input className="inp" type="number" min="0" step="1" value={f.purchase_qty} onChange={e=>ch("purchase_qty",e.target.value)} placeholder="Qty in that purchase"/></div>
      {/* Row 3: Unit | Category */}
      <div><label className="fl">Unit</label><input className="inp" value={f.unit} onChange={e=>ch("unit",e.target.value)} placeholder="Gram, ml, pcs, L…"/></div>
      <div><label className="fl">Ingredient Category</label>
        <select className="inp" value={f.ingr_category} onChange={e=>ch("ingr_category",e.target.value)}>
          <option value="">— select —</option>
          {ingrCats.map(c=><option key={c.id} value={c.name}>{c.name}</option>)}
        </select>
      </div>
      {/* Row 4: Cost/Unit + Yield (full width card) */}
      <div className="card" style={{padding:"12px 16px",gridColumn:"1/-1",background:"#f0fdf4",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div>
          <div className="fl" style={{marginBottom:2}}>Cost per Unit (auto-calculated)</div>
          <div style={{fontSize:20,fontWeight:800,color:"#166534"}}>{pp>0&&pq>0?fmtB(cpu):"—"}</div>
          <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{pp>0&&pq>0?`฿${pp} ÷ ${pq} ${f.unit||"unit"}`:""}</div>
        </div>
        <div style={{textAlign:"right"}}>
          <div className="fl" style={{marginBottom:2}}>Yield %</div>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <input className="inp" type="number" min="0.01" max="1" step="0.01" value={f.yield_pct} onChange={e=>ch("yield_pct",e.target.value)} style={{width:70}}/>
            <span style={{fontSize:12,color:"#6b7280"}}>(1 = no waste)</span>
          </div>
        </div>
      </div>
      {/* Row 5: Last Price Update | Has VAT */}
      <div><label className="fl">Last Price Update</label><input className="inp" type="date" value={f.last_price_date} onChange={e=>ch("last_price_date",e.target.value)}/></div>
      <div style={{display:"flex",alignItems:"center",gap:8,paddingTop:20}}>
        <input type="checkbox" id="vatc" checked={!!f.vat} onChange={e=>ch("vat",e.target.checked)}/>
        <label htmlFor="vatc" style={{fontSize:13,color:"#374151",fontWeight:500}}>Has VAT</label>
      </div>
      {/* Row 6: Notes (full width) */}
      <div style={{gridColumn:"1/-1"}}><label className="fl">Notes</label><input className="inp" value={f.notes} onChange={e=>ch("notes",e.target.value)}/></div>
    </div>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:20}}>
      <button onClick={onClose} className="btn btn-o">Cancel</button>
      <button onClick={save} className="btn btn-g">Save</button>
    </div>
  </Modal>;
}

/* ── UploadIngrModal ── */
function UploadIngrModal({open,onClose,existingIngredients,updateIngredients}){
  const[preview,setPreview]=useState(null);
  const[error,setError]=useState("");
  const[importing,setImporting]=useState(false);
  const fileRef=useRef();

  function onFile(e){
    const file=e.target.files[0];if(!file)return;
    setError("");setPreview(null);
    parseIngredientExcel(file,(rows)=>{
      if(rows===null){setError("Could not parse file. Make sure the first sheet has a 'name' column.");return;}
      if(rows.length===0){setError("No data rows found in file.");return;}
      const existNames=new Set(existingIngredients.map(i=>i.name.toLowerCase()));
      const toAdd=rows.filter(r=>!existNames.has(r.name.toLowerCase()));
      const dups=rows.length-toAdd.length;
      setPreview({rows,toAdd,dups});
    });
  }
  function doImport(){
    setImporting(true);
    updateIngredients(prev=>[...prev,...preview.toAdd]);
    setImporting(false);
    setPreview(null);
    onClose();
  }
  function reset(){setPreview(null);setError("");if(fileRef.current)fileRef.current.value="";}

  return <Modal open={open} onClose={()=>{reset();onClose();}} title="Upload Ingredients from Excel" wide>
    <div style={{display:"flex",gap:12,marginBottom:20,flexWrap:"wrap"}}>
      <button onClick={downloadIngredientTemplate} className="btn btn-b">⬇ Download Template</button>
      <button onClick={()=>fileRef.current?.click()} className="btn btn-g">⬆ Choose Excel File</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls,.csv" style={{display:"none"}} onChange={onFile}/>
    </div>
    {error&&<div style={{background:"#fee2e2",color:"#991b1b",padding:"10px 14px",borderRadius:8,fontSize:13,marginBottom:14}}>{error}</div>}
    {!preview&&<div style={{fontSize:13,color:"#6b7280",lineHeight:1.7}}>
      <strong>Instructions:</strong><br/>

    {preview&&<>
      <div style={{marginBottom:12,fontSize:13,color:"#374151"}}>

        {preview.dups>0&&<span style={{color:"#d97706"}}> · {preview.dups} duplicate(s) skipped</span>}
      </div>
      <div style={{maxHeight:300,overflowY:"auto",marginBottom:16}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr><th className="th">Supplier</th><th className="th">Name</th><th className="th">Category</th><th className="th">Price (฿)</th><th className="th">Qty</th><th className="th">Unit</th><th className="th">Cost/Unit</th><th className="th">Status</th></tr></thead>
          <tbody>{preview.rows.map((r,i)=>{
            const isDup=existingIngredients.some(e=>e.name.toLowerCase()===r.name.toLowerCase());
            return <tr key={i} style={{opacity:isDup?.5:1}}>
              <td className="td" style={{color:"#6b7280",fontSize:12}}>{r.supplier||"—"}</td>
              <td className="td" style={{fontWeight:500}}>{r.name}</td>
              <td className="td" style={{fontSize:12}}>{r.ingr_category||"—"}</td>
              <td className="td">{r.purchase_price?fmtB(r.purchase_price):"—"}</td>

              <td className="td" style={{color:"#6b7280"}}>{r.unit||"—"}</td>
              <td className="td" style={{fontWeight:600}}>{r.cost_per_unit?fmtB(r.cost_per_unit):"—"}</td>
              <td className="td">{isDup?<span style={{color:"#d97706",fontSize:12}}>⚠ skip (dup)</span>:<span style={{color:"#16a34a",fontSize:12}}>✓ import</span>}</td>
            </tr>;
          })}</tbody>
        </table>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={reset} className="btn btn-o">Clear</button>
        <button onClick={doImport} disabled={preview.toAdd.length===0||importing} className="btn btn-g">
          {importing?"Importing…":`Import ${preview.toAdd.length} Ingredients`}
        </button>
      </div>
    </>}
  </Modal>;
}

/* ── UploadRecipeBookModal ── */
function UploadRecipeBookModal({open,onClose,menus,updateMenus,ingredients,updateIngredients,updateRecipeLines,updateCookingSteps}){
  const[preview,setPreview]=useState(null);
  const[error,setError]=useState("");
  const[addMissing,setAddMissing]=useState(true);
  const[importing,setImporting]=useState(false);
  const fileRef=useRef();

  function matchMenu(sheet){
    const try_=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();
    return menus.find(m=>
      try_(m.name_th,sheet.name_th)||try_(m.name_en,sheet.name_en)||
      try_(m.name_th,sheet.sheetName)||try_(m.name_en,sheet.sheetName)||
      try_(m.name_th,sheet.name_en)||try_(m.name_en,sheet.name_th)
    )||null;
  }

  function onFile(e){
    const file=e.target.files[0];if(!file)return;
    setError("");setPreview(null);
    parseRecipeBook(file,(results)=>{
      if(!results){setError("Could not parse file.");return;}
      if(!results.length){setError("No recipe sheets found.");return;}
      const seen=new Map(); // ingredient name (lower) → first occurrence
      const processed=results.map(sheet=>{
        const matched=matchMenu(sheet);
        const newIngr=[];
        const lines=sheet.lines.map(l=>{
          const existing=ingredients.find(i=>i.name.toLowerCase()===l.ingredient_name.toLowerCase());
          if(!existing&&!seen.has(l.ingredient_name.toLowerCase())){
            seen.set(l.ingredient_name.toLowerCase(),l);
            newIngr.push(l);
          }
          return{...l,existing_ingr:existing||null};
        });
        return{...sheet,matched,lines,newIngr};
      });
      setPreview(processed);
    });
  }

  function doImport(){
    setImporting(true);
    // Build final ingredient list (current + newly added stubs)
    const finalIngr=[...ingredients];
    if(addMissing){
      const seen=new Set(ingredients.map(i=>i.name.toLowerCase()));
      for(const sheet of preview){
        for(const ni of sheet.newIngr){
          if(!seen.has(ni.ingredient_name.toLowerCase())){
            seen.add(ni.ingredient_name.toLowerCase());
            finalIngr.push({
              id:uid(),name:ni.ingredient_name,supplier:"",ingr_category:"",
              purchase_price:ni.cost_per_unit*(ni.purchase_qty||1),
              purchase_qty:ni.purchase_qty,unit:ni.purchase_unit,
              cost_per_unit:ni.cost_per_unit,vat:false,
              yield_pct:ni.yield_pct,last_price_date:"",notes:"",
            });
          }
        }
      }
      updateIngredients(()=>finalIngr);
    }
    // Build new recipe lines
    const newLines=[];
    const replacedMenuIds=new Set();
    for(const sheet of preview){
      if(!sheet.matched)continue;
      replacedMenuIds.add(String(sheet.matched.id));
      for(const line of sheet.lines){
        const ingr=finalIngr.find(i=>i.name.toLowerCase()===line.ingredient_name.toLowerCase());
        if(!ingr)continue;
        // Use cost from Excel if available, else calc from master
        const cost=line.ingredient_cost>0?line.ingredient_cost:calcLineIngCost(ingr,line.usage_qty);
        newLines.push({
          id:uid(),menu_id:sheet.matched.id,
          ingredient_id:ingr.id,ingredient_name:ingr.name,
          usage_qty:line.usage_qty,usage_unit:line.usage_unit,
          ingredient_cost:Math.round(cost*10000)/10000,
        });
      }
    }
    updateRecipeLines(prev=>[...prev.filter(l=>!replacedMenuIds.has(String(l.menu_id))),...newLines]);
    // Update serves_per_recipe on matched menus
    if(updateMenus){
      updateMenus(prev=>prev.map(m=>{
        const sheet=preview.find(s=>s.matched&&String(s.matched.id)===String(m.id));
        if(!sheet||!sheet.serves_per_recipe)return m;
        return{...m,serves_per_recipe:sheet.serves_per_recipe};
      }));
    }
    // Import cooking steps
    const newSteps=[];
    for(const sheet of preview){
      if(!sheet.matched)continue;
      for(const step of(sheet.steps||[])){
        newSteps.push({id:uid(),menu_id:sheet.matched.id,step_no:step.step_no,instruction:step.instruction});
      }
    }
    if(newSteps.length>0&&updateCookingSteps){
      updateCookingSteps(prev=>[...prev.filter(s=>!replacedMenuIds.has(String(s.menu_id))),...newSteps]);
    }
    setImporting(false);
    setPreview(null);
    if(fileRef.current)fileRef.current.value="";
    onClose();
  }

  const matchedCount=preview?preview.filter(s=>s.matched).length:0;
  const unmatchedCount=preview?preview.filter(s=>!s.matched).length:0;
  const allNewIngr=preview?[...new Map(preview.flatMap(s=>s.newIngr).map(i=>[i.ingredient_name.toLowerCase(),i])).values()]:[];
  const totalLines=preview?preview.filter(s=>s.matched).reduce((n,s)=>n+s.lines.length,0):0;
  const totalSteps=preview?preview.filter(s=>s.matched).reduce((n,s)=>n+(s.steps||[]).length,0):0;

  return <Modal open={open} onClose={()=>{setPreview(null);setError("");if(fileRef.current)fileRef.current.value="";onClose();}} title="Upload Recipe Book (Multi-Sheet Excel)" wide>
    <div style={{display:"flex",gap:12,marginBottom:16,alignItems:"center"}}>
      <button onClick={()=>fileRef.current?.click()} className="btn btn-g">📂 Choose Excel File</button>
      <input ref={fileRef} type="file" accept=".xlsx,.xls" style={{display:"none"}} onChange={onFile}/>
      <div style={{fontSize:13,color:"#6b7280"}}>Each sheet = one menu. Reads: Thai name, ingredient list, qty, unit, cost.</div>
    </div>
    {error&&<div style={{background:"#fee2e2",color:"#991b1b",padding:"10px 14px",borderRadius:8,fontSize:13,marginBottom:14}}>{error}</div>}

    {preview&&<>
      {/* Summary bar */}
      <div style={{display:"flex",gap:12,marginBottom:16,flexWrap:"wrap"}}>
        {[
          {label:"Sheets found",val:preview.length,bg:"#dbeafe",tx:"#1e40af"},
          {label:"Matched to menus",val:matchedCount,bg:"#dcfce7",tx:"#166534"},
          {label:"Unmatched",val:unmatchedCount,bg:unmatchedCount>0?"#fee2e2":"#f3f4f6",tx:unmatchedCount>0?"#991b1b":"#6b7280"},
          {label:"Recipe lines",val:totalLines,bg:"#fef9c3",tx:"#92400e"},
          {label:"Cooking steps",val:totalSteps,bg:totalSteps>0?"#dbeafe":"#f3f4f6",tx:totalSteps>0?"#1d4ed8":"#6b7280"},
          {label:"New ingredients",val:allNewIngr.length,bg:allNewIngr.length>0?"#ede9fe":"#f3f4f6",tx:allNewIngr.length>0?"#5b21b6":"#6b7280"},
        ].map(({label,val,bg,tx})=>
          <div key={label} className="card" style={{padding:"10px 16px",flex:1,minWidth:100}}>
            <div style={{fontSize:22,fontWeight:800,color:tx}}>{val}</div>
            <div style={{fontSize:11,color:"#6b7280",marginTop:2}}>{label}</div>
          </div>
        )}
      </div>

      {/* Sheet match table */}
      <div style={{maxHeight:200,overflowY:"auto",marginBottom:14}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr><th className="th">Sheet Name</th><th className="th">Thai Name (in file)</th><th className="th">Matched Menu</th><th className="th" style={{textAlign:"right"}}>Lines</th><th className="th" style={{textAlign:"right"}}>Steps</th></tr></thead>
          <tbody>{preview.map((s,i)=><tr key={i}>
            <td className="td" style={{fontSize:12,color:"#6b7280"}}>{s.sheetName}</td>
            <td className="td" style={{fontWeight:500}}>{s.name_th}</td>
            <td className="td">{s.matched
              ?<span className="badge" style={{background:"#dcfce7",color:"#166534"}}>✓ {s.matched.menu_id} — {s.matched.name_en||s.matched.name_th}</span>
              :<span className="badge" style={{background:"#fee2e2",color:"#991b1b"}}>✗ No match</span>}
            </td>
            <td className="td" style={{textAlign:"right"}}>{s.lines.length}</td>
            <td className="td" style={{textAlign:"right"}}>{(s.steps||[]).length>0?<span className="badge" style={{background:"#dbeafe",color:"#1e40af"}}>{(s.steps||[]).length}</span>:"—"}</td>
          </tr>)}</tbody>
        </table>
      </div>

      {/* New ingredients */}
      {allNewIngr.length>0&&<div className="card" style={{padding:"14px 18px",marginBottom:14,background:"#faf5ff"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div style={{fontSize:13,fontWeight:700,color:"#5b21b6"}}>🆕 {allNewIngr.length} ingredients not in master list</div>
          <label style={{display:"flex",alignItems:"center",gap:6,fontSize:13,cursor:"pointer"}}>
            <input type="checkbox" checked={addMissing} onChange={e=>setAddMissing(e.target.checked)}/>
            Auto-add these to Ingredients master list
          </label>
        </div>
        <div style={{maxHeight:140,overflowY:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr><th className="th">Name</th><th className="th">Cost/Unit from recipe</th><th className="th">Yield</th><th className="th">Usage Unit</th></tr></thead>
            <tbody>{allNewIngr.map((ni,i)=><tr key={i}>
              <td className="td" style={{fontWeight:500}}>{ni.ingredient_name}</td>
              <td className="td">{ni.cost_per_unit?fmtB(ni.cost_per_unit):"—"}</td>
              <td className="td">{(ni.yield_pct*100).toFixed(0)}%</td>
              <td className="td" style={{color:"#6b7280"}}>{ni.purchase_unit||"—"}</td>
            </tr>)}</tbody>
          </table>
        </div>
        {!addMissing&&<div style={{marginTop:8,fontSize:12,color:"#d97706"}}>⚠️ Lines for unmatched ingredients will be skipped.</div>}
      </div>}

      {unmatchedCount>0&&<div style={{marginBottom:14,fontSize:13,color:"#6b7280",padding:"10px 14px",background:"#fef9c3",borderRadius:8}}>
        ⚠️ {unmatchedCount} sheet(s) couldn't be matched to a menu — they will be skipped. Make sure the menu names in your Excel match the Thai or English names in the system.
      </div>}

      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:4}}>
        <button onClick={()=>{setPreview(null);if(fileRef.current)fileRef.current.value="";}} className="btn btn-o">Clear</button>
        <button onClick={doImport} disabled={matchedCount===0||importing} className="btn btn-g">
          {importing?"Importing…":`Import ${totalLines} lines + ${totalSteps} steps into ${matchedCount} menu(s)`}
        </button>
      </div>
    </>}

    {!preview&&!error&&<div style={{fontSize:13,color:"#6b7280",lineHeight:1.8}}>
      <strong>How it works:</strong><br/>
      1. Pick your recipe Excel file — the one with one sheet per menu.<br/>
      2. The system reads the Thai/English menu name from each sheet and matches it to your menu list.<br/>
      3. Review the preview: matched menus, new ingredients, and line count.<br/>
      4. Click Import — existing recipe lines for matched menus are replaced with the file's data.
    </div>}
  </Modal>;
}

/* ── IngredientsPage ── */
function IngredientsPage({ingredients,updateIngredients,onIngrCatMgr}){
  const ingrCats=useContext(IngrCatsCtx);
  const[editI,setEditI]=useState(null);const[showAdd,setShowAdd]=useState(false);
  const[delId,setDelId]=useState(null);const[search,setSearch]=useState("");
  const[showUpload,setShowUpload]=useState(false);
  const[catFilter,setCatFilter]=useState("All");
  const filtered=useMemo(()=>ingredients.filter(i=>{
    if(catFilter!=="All"&&i.ingr_category!==catFilter)return false;
    if(search){const s=search.toLowerCase();return(i.name||"").toLowerCase().includes(s)||(i.supplier||"").toLowerCase().includes(s);}
    return true;
  }),[ingredients,search,catFilter]);
  function save(i){updateIngredients(prev=>{const idx=prev.findIndex(x=>x.id===i.id);if(idx>=0){const n=[...prev];n[idx]=i;return n;}return[...prev,i];});}
  function del(id){updateIngredients(prev=>prev.filter(i=>i.id!==id));setDelId(null);}
  return <div style={{flex:1,padding:"28px 32px",overflowY:"auto"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
      <div><h2 style={{fontSize:22,fontWeight:700,margin:0}}>Ingredient Master List</h2>
        <div style={{fontSize:13,color:"#6b7280",marginTop:2}}>{ingredients.length} ingredients</div></div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>downloadIngredientTemplate(ingrCats)} className="btn btn-b" title="Download blank Excel template">⬇ Template</button>
        <button onClick={()=>setShowUpload(true)} className="btn btn-o">⬆ Upload Excel</button>
        <button onClick={onIngrCatMgr} className="btn btn-o" title="Manage ingredient categories">🏷 Categories</button>
        <button onClick={()=>setShowAdd(true)} className="btn btn-g">+ Add Ingredient</button>
      </div>
    </div>
    <div style={{marginBottom:14}}>
      <input className="inp" placeholder="Search ingredients…" value={search} onChange={e=>setSearch(e.target.value)} style={{width:280,marginBottom:8}}/>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
        <span style={{fontSize:11,fontWeight:700,color:"#94a3b8",letterSpacing:".06em",textTransform:"uppercase",flexShrink:0}}>Category:</span>
        {["All",...ingrCats.map(c=>c.name)].map(c=><button key={c} onClick={()=>setCatFilter(c)} className="btn"
          style={{fontSize:11,padding:"4px 11px",background:catFilter===c?"#166534":"#f1f5f9",color:catFilter===c?"#fff":"#374151",whiteSpace:"nowrap"}}>
          {c}
        </button>)}
      </div>
    </div>
    {filtered.length===0?<div className="card" style={{padding:40,textAlign:"center",color:"#9ca3af"}}>
      <div style={{fontSize:32,marginBottom:12}}>🧂</div>
      <div style={{fontSize:15,fontWeight:600,marginBottom:6}}>No ingredients yet</div>
      <div style={{fontSize:13}}>Upload an Excel file or add ingredients one by one.</div>
    </div>:
    <div className="card" style={{overflow:"hidden"}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr>
          <th className="th">Name</th>
          <th className="th">Supplier</th>
          <th className="th">Category</th>
          <th className="th" style={{textAlign:"right"}}>Price (฿)</th>
          <th className="th" style={{textAlign:"right"}}>Qty</th>
          <th className="th">Unit</th>
          <th className="th" style={{textAlign:"right"}}>Cost/Unit</th>
          <th className="th" style={{textAlign:"right"}}>Yield</th>
          <th className="th" style={{textAlign:"right"}}>Eff. Cost/Unit</th>
          <th className="th">VAT</th>
          <th className="th">Last Updated</th>
          <th className="th">Actions</th>
        </tr></thead>
        <tbody>{filtered.map(i=>{
          const yld=parseFloat(i.yield_pct||1);const cpu=parseFloat(i.cost_per_unit||0);
          return <tr key={i.id}>
            <td className="td">
              <div style={{fontWeight:500}}>{i.name}</div>
              {i.name_th&&i.name_th!==i.name&&<div style={{fontSize:11,color:"#9ca3af"}}>{i.name_th}</div>}
              {toBool(i.is_precooked)&&<span className="badge" style={{background:"#fef3c7",color:"#92400e",marginTop:2}}>🍳 Pre-Cooked</span>}
            </td>

            <td className="td" style={{textAlign:"right"}}>{fmtB(i.purchase_price||0)}</td>
            <td className="td" style={{textAlign:"right",color:"#6b7280"}}>{i.purchase_qty||"—"}</td>
            <td className="td" style={{color:"#6b7280",fontSize:12}}>{i.unit||"—"}</td>
