// ── GOOGLE SHEETS READ (gviz — public, no auth needed) ────────────────────────
function gvizFetch(spreadsheetId, sheetName){
  return new Promise((resolve,reject)=>{
    const cbName="_gviz_cb_"+uid();
    const url=`https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:json&tq=select+*&sheet=${encodeURIComponent(sheetName)}&cb=${cbName}`;
    window[cbName]=(data)=>{ delete window[cbName]; document.head.removeChild(s); resolve(data); };
    const s=document.createElement("script"); s.src=url;
    s.onerror=()=>{ delete window[cbName]; reject(new Error("gviz fetch failed")); };
    document.head.appendChild(s);
    setTimeout(()=>{ if(window[cbName]){ delete window[cbName]; reject(new Error("timeout")); } },10000);
  });
}
async function sheetsRead(spreadsheetId, sheetName){
  try{
    const raw=await gvizFetch(spreadsheetId, sheetName);
    const cols=(raw.table?.cols||[]).map(c=>c.label||c.id||"");
    const rows=(raw.table?.rows||[]).map(r=>{
      const obj={}; (r.c||[]).forEach((cell,i)=>{ obj[cols[i]]=cell?.v??cell?.f??""; }); return obj;

    return rows.filter(r=>Object.values(r).some(v=>v!==null&&v!==""));
  }catch(e){ return null; }
}

async function sheetsApiRead(token, spreadsheetId, tabName){

      {headers:{"Authorization":"Bearer "+token}}

  }catch(e){ return null; }
}

  const body=[headers,...dataRows];
  const range=`${tabName}!A1`;
  await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(range)}?valueInputOption=RAW`,{
    method:"PUT", headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
    body:JSON.stringify({range,majorDimension:"ROWS",values:body})
  });
}
async function sheetsEnsure(token, spreadsheetId, tabName, headers){
  const meta=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties.title`,
    {headers:{"Authorization":"Bearer "+token}}).then(r=>r.json());
  const exists=(meta.sheets||[]).some(s=>s.properties.title===tabName);
  if(!exists){
    await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`,{
      method:"POST", headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
      body:JSON.stringify({requests:[{addSheet:{properties:{title:tabName}}}]})
    });
    await sheetsApiWrite(token, spreadsheetId, tabName, headers, []);
  }
}

// ── AUTH HOOK ─────────────────────────────────────────────────────────────────
const _FOOD_USER_KEY="upb_food_login_hint";
let _refreshTimer=null;

function useAuth(){
  const [token,setToken]=useState(null);
  const [gisReady,setGisReady]=useState(false);
  const clientRef=useRef(null);

  useEffect(()=>{
    const s=document.createElement("script"); s.src="https://accounts.google.com/gsi/client"; s.async=true;
    s.onload=()=>setGisReady(true); document.head.appendChild(s);
  },[]);

  const scheduleRefresh=useCallback(()=>{
    if(_refreshTimer) clearTimeout(_refreshTimer);
    _refreshTimer=setTimeout(()=>{
      if(!clientRef.current)return;
      const hint=localStorage.getItem(_FOOD_USER_KEY)||"";
      clientRef.current.requestAccessToken({prompt:"", login_hint:hint});
    }, 55*60*1000);
  },[]);

  const initClient=useCallback(()=>{
    if(!gisReady||clientRef.current)return;
    clientRef.current=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID, scope:SCOPES,
      callback:(resp)=>{
        if(resp.access_token){
          setToken(resp.access_token);
          scheduleRefresh();
          try{
            const profile=JSON.parse(atob(resp.access_token.split(".")[1]||"e30="));
            if(profile.email) localStorage.setItem(_FOOD_USER_KEY, profile.email);
          }catch(e){}
        }
      }
    });
  },[gisReady, scheduleRefresh]);

  useEffect(()=>{ initClient(); },[initClient]);
  const login=useCallback(()=>{ if(clientRef.current) clientRef.current.requestAccessToken(); },[]);
  return { token, login, gisReady };
}

// ── useSave HOOK ──────────────────────────────────────────────────────────────
function dedupeRows(rows, pkField){
  const seen=new Map();
  rows.forEach(r=>{ if(r[pkField]!==undefined&&r[pkField]!=="") seen.set(r[pkField],r); });
  return [...seen.values()];
}

function useSave(tabName, headers, initial){
  const [data,setData]=useState(initial);
  const [synced,setSynced]=useState(false);
  const [saveError,setSaveError]=useState(false);
  const tokenRef=useRef(null);
  const dirtyRef=useRef(false);
  const [saveVersion,setSaveVersion]=useState(0);
  const authLoadedRef=useRef(false);

  const setToken=useCallback((t)=>{
    tokenRef.current=t;
    if(SPREADSHEET_ID==="1qfXTf3h1CWFbvgr2mlLvedWUxjH8PVwX7L7ndXq8V3o")return;
    sheetsApiRead(t, SPREADSHEET_ID, tabName).then(rows=>{
      authLoadedRef.current=true;
      if(rows&&rows.length>0){
        let cleaned=dedupeRows(rows, headers[0]);
        if(!dirtyRef.current){ setData(cleaned); }
      } else {
        dirtyRef.current=true;
        setSaveVersion(v=>v+1);
      }
    });
  },[tabName, headers]);

  useEffect(()=>{
    if(SPREADSHEET_ID==="1qfXTf3h1CWFbvgr2mlLvedWUxjH8PVwX7L7ndXq8V3o")return;
    sheetsRead(SPREADSHEET_ID, tabName).then(rows=>{
      if(rows&&rows.length>0&&!authLoadedRef.current&&!tokenRef.current){
        setData(dedupeRows(rows, headers[0]));
      }
      setSynced(true);
    }).catch(()=>setSynced(true));
  },[tabName, headers]);

  useEffect(()=>{
    if(!dirtyRef.current||!tokenRef.current||SPREADSHEET_ID==="1qfXTf3h1CWFbvgr2mlLvedWUxjH8PVwX7L7ndXq8V3o")return;
    const t=setTimeout(async()=>{
      if(!dirtyRef.current)return;
      try{
        await sheetsEnsure(tokenRef.current, SPREADSHEET_ID, tabName, headers);
        await sheetsApiWrite(tokenRef.current, SPREADSHEET_ID, tabName, headers, data);
        dirtyRef.current=false;
        setSaveError(false);
      }catch(e){
        console.error("[useSave] write failed:", tabName, e);
        setSaveError(true);
      }
    },1200);
    return()=>clearTimeout(t);
  },[data, saveVersion, tabName, headers]);

  const forcePush=useCallback(()=>{
    if(tokenRef.current){ dirtyRef.current=true; setSaveVersion(v=>v+1); }
  },[]);

  const update=useCallback((fn)=>{
    setData(fn);
    dirtyRef.current=true;
    setSaveVersion(v=>v+1);
  },[]);

  return [data, update, synced, setToken, forcePush, saveError];
}

    cost_per_unit:"",yield_pct:"1",actual_cost:"",usage_qty:"",usage_unit:"",ingredient_cost:""
  }]);
  const removeRow=(id)=>setRows(r=>r.filter(x=>x.id!==id));
  const setField=(id,k,v)=>setRows(r=>r.map(x=>x.id===id?{...x,[k]:v}:x));

  const calcCost=(row)=>{
    const cpu=+row.cost_per_unit, yld=+row.yield_pct||1, qty=+row.usage_qty;
    if(!cpu||!qty)return"";
    return ((cpu/yld)*qty).toFixed(4);
  };

  const save=()=>{
    const valid=rows.filter(r=>r.ingredient_name.trim());
    const final=valid.map(r=>({...r,ingredient_cost:calcCost(r)||r.ingredient_cost}));
    onSave(menu.menu_id, final);
  };

  const th={fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",letterSpacing:".04em",
    padding:"6px 8px",textAlign:"left",borderBottom:"1px solid #f1f5f9",whiteSpace:"nowrap"};
  const td={padding:"6px 4px",verticalAlign:"middle"};

  return <Modal open={true} onClose={onClose} title={`Recipe Ingredients — ${menu.name_th}`} wide={true}>
    <div style={{overflowX:"auto",marginBottom:14}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
        <thead>
          <tr>
            {["Ingredient","Purchase Qty","Unit","Cost/Unit","Yield %","Usage Qty","Usage Unit","Cost (฿)",""].map(h=>
              <th key={h} style={th}>{h}</th>)}
          </tr>
        </thead>
        <tbody>
          {rows.map(row=><tr key={row.id}>
            {[
              {k:"ingredient_name",ph:"วัตถุดิบ / Ingredient",w:140},
              {k:"purchase_qty",    ph:"1000",type:"number",w:80},
              {k:"purchase_unit",   ph:"Gram",w:70},
              {k:"cost_per_unit",   ph:"0.05",type:"number",w:85},
              {k:"yield_pct",       ph:"1.0", type:"number",w:70},
              {k:"usage_qty",       ph:"120", type:"number",w:80},
              {k:"usage_unit",      ph:"Gram",w:70},
            ].map(({k,ph,type,w})=>
              <td key={k} style={td}>
                <input className="input-cls" type={type||"text"} value={row[k]}
                  onChange={e=>setField(row.id,k,e.target.value)}
                  placeholder={ph} style={{minWidth:w,padding:"6px 8px",fontSize:12}}/>
              </td>
            )}
            <td style={{...td,color:"#374151",fontWeight:600,fontSize:12,minWidth:70}}>
              {calcCost(row)?("฿"+(+calcCost(row)).toFixed(2)):"—"}
            </td>
            <td style={td}>
              <button onClick={()=>removeRow(row.id)} style={{background:"none",border:"none",
                cursor:"pointer",color:"#dc2626",fontSize:16,padding:"4px"}}>✕</button>
            </td>
          </tr>)}
        </tbody>
      </table>
    </div>
    <button onClick={addRow} className="btn-ghost" style={{fontSize:13,marginBottom:20}}>
      + Add Ingredient
    </button>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
      <button onClick={onClose} className="btn-ghost">Cancel</button>
      <button onClick={save} className="btn-primary">Save Ingredients</button>
    </div>
  </Modal>;
}

// ── EDIT COOKING STEPS MODAL ──────────────────────────────────────────────────
function EditStepsModal({menu,steps,onSave,onClose}){
  const mySteps=steps.filter(s=>s.menu_id===menu.menu_id).sort((a,b)=>(+a.step_no)-(+b.step_no));
  const [rows,setRows]=useState(mySteps.length>0?mySteps:[{id:uid(),menu_id:menu.menu_id,step_no:1,instruction:""}]);

  const addRow=()=>setRows(r=>[...r,{id:uid(),menu_id:menu.menu_id,step_no:r.length+1,instruction:""}]);
  const removeRow=(id)=>setRows(r=>r.filter(x=>x.id!==id).map((x,i)=>({...x,step_no:i+1})));
  const setInstr=(id,v)=>setRows(r=>r.map(x=>x.id===id?{...x,instruction:v}:x));

  const save=()=>{
    const valid=rows.filter(r=>r.instruction.trim());
    onSave(menu.menu_id, valid.map((r,i)=>({...r,step_no:i+1})));
  };

  return <Modal open={true} onClose={onClose} title={`Cooking Steps — ${menu.name_th}`} wide={true}>
    <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:14}}>
      {rows.map((row,i)=><div key={row.id} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
        <div style={{width:28,height:28,borderRadius:"50%",background:"#166534",color:"#fff",
          fontSize:13,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",
          flexShrink:0,marginTop:6}}>{i+1}</div>
        <textarea className="input-cls" value={row.instruction}
          onChange={e=>setInstr(row.id,e.target.value)}
          placeholder={`Step ${i+1} instruction...`}
          rows={2} style={{resize:"vertical",fontSize:13,flex:1}}/>
        <button onClick={()=>removeRow(row.id)} style={{background:"none",border:"none",
          cursor:"pointer",color:"#dc2626",fontSize:18,padding:"6px",marginTop:2}}>✕</button>
      </div>)}
    </div>
    <button onClick={addRow} className="btn-ghost" style={{fontSize:13,marginBottom:20}}>
      + Add Step
    </button>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
      <button onClick={onClose} className="btn-ghost">Cancel</button>
      <button onClick={save} className="btn-primary">Save Steps</button>
    </div>
  </Modal>;
}

// ── MENUS PAGE ────────────────────────────────────────────────────────────────
function MenusPage({menus,setMenus,recipeIng,steps,token,onViewRecipe}){
  const [catFilter,setCatFilter]=useState("All");
  const [search,setSearch]=useState("");
  const [showAdd,setShowAdd]=useState(false);
  const [editMenu,setEditMenu]=useState(null);
  const [deleteConfirm,setDeleteConfirm]=useState(null);

  const filtered=useMemo(()=>{
    let list=catFilter==="All"?menus:menus.filter(m=>m.category===catFilter);
    if(search.trim()){
      const q=search.toLowerCase();
      list=list.filter(m=>
        (m.name_th||"").toLowerCase().includes(q)||
        (m.name_en||"").toLowerCase().includes(q)||
        (m.menu_id||"").toLowerCase().includes(q)
      );
    }
    return list;
  },[menus,catFilter,search]);

  const saveEdit=(updated)=>{
    setMenus(d=>d.map(m=>m.id===updated.id?updated:m));
    setEditMenu(null);
  };
  const addMenu=(newMenu)=>{
    setMenus(d=>[...d,newMenu]);
    setShowAdd(false);
  };
  const deleteMenu=(id)=>{
    setMenus(d=>d.filter(m=>m.id!==id));
    setDeleteConfirm(null);
  };

  return <div style={{padding:"32px 36px"}}>
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
      <div>
        <h1 style={{fontSize:24,fontWeight:800,color:"#111827",margin:"0 0 4px"}}>All Menus</h1>
        <p style={{fontSize:13,color:"#9ca3af",margin:0}}>{filtered.length} of {menus.length} items</p>
      </div>
      {token && <button onClick={()=>setShowAdd(true)} className="btn-primary">+ Add Menu</button>}
    </div>

    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18,flexWrap:"wrap"}}>
      <input className="input-cls" value={search} onChange={e=>setSearch(e.target.value)}
        placeholder="🔍 Search Thai, English, or ID..." style={{maxWidth:280}}/>
      <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
        {CATEGORIES.map(cat=>
          <button key={cat} onClick={()=>setCatFilter(cat)}
            className={"cat-pill"+(catFilter===cat?" active":"")}>
            {CAT_ICONS[cat]} {cat}
          </button>
        )}
      </div>
    </div>

    <div className="card" style={{overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse",fontSize:13}}>
          <thead>
            <tr style={{background:"#f8fafc"}}>
              {["ID","Thai Name","English Name","Category","Store Price","Cost/Serve","Food Cost","Verified",""].map(h=>
                <th key={h} style={{fontSize:11,fontWeight:700,color:"#6b7280",textTransform:"uppercase",
                  letterSpacing:".04em",padding:"12px 14px",textAlign:"left",
                  borderBottom:"1px solid #f1f5f9",whiteSpace:"nowrap"}}>{h}</th>
              )}
            </tr>
          </thead>
          <tbody>
            {filtered.length===0 && <tr><td colSpan={9} style={{padding:"32px",textAlign:"center",color:"#9ca3af",fontSize:13}}>
              No menus found{search?" for that search":""}.
            </td></tr>}
            {filtered.map(menu=>{
              const hasRecipe=recipeIng.some(r=>r.menu_id===menu.menu_id);
              const checked=menu.checked===true||menu.checked==="true";
              return <tr key={menu.id} style={{borderBottom:"1px solid #f9fafb",cursor:"pointer"}}
                onClick={()=>onViewRecipe(menu)}>
                <td style={{padding:"12px 14px",fontWeight:700,color:"#374151",whiteSpace:"nowrap"}} onClick={e=>e.stopPropagation()}>
                  <button onClick={()=>onViewRecipe(menu)} style={{background:"none",border:"none",
                    cursor:"pointer",color:"#166534",fontWeight:700,fontFamily:"Inter,sans-serif",
                    fontSize:13,padding:0}}>{menu.menu_id}</button>
                </td>
                <td style={{padding:"12px 14px",fontWeight:600,color:"#111827",maxWidth:200}}>
                  <div>{menu.name_th}</div>
                  {hasRecipe && <span style={{fontSize:10,color:"#166534",fontWeight:700}}>📋 Has recipe</span>}
                </td>
                <td style={{padding:"12px 14px",color:"#6b7280",maxWidth:220,fontSize:12}}>{menu.name_en||"—"}</td>
                <td style={{padding:"12px 14px"}}><CatBadge category={menu.category}/></td>
                <td style={{padding:"12px 14px",color:"#374151",fontWeight:600}}>{fmtThb(menu.store_price)}</td>
                <td style={{padding:"12px 14px",color:"#374151"}}>{fmtThb(menu.cost_per_serve)}</td>
                <td style={{padding:"12px 14px",fontWeight:700}} className={costColor(menu.food_cost_pct)}>
                  {fmtPct(menu.food_cost_pct)}
                </td>
                <td style={{padding:"12px 14px"}}>
                  {checked
                    ? <span style={{color:"#166534",fontSize:16}}>✓</span>
                    : <span style={{color:"#e5e7eb",fontSize:16}}>○</span>}
                </td>
                <td style={{padding:"12px 14px"}} onClick={e=>e.stopPropagation()}>
                  <div style={{display:"flex",gap:4}}>
                    <button onClick={e=>{e.stopPropagation();setEditMenu(menu);}} style={{background:"none",
                      border:"1px solid #e5e7eb",cursor:"pointer",borderRadius:8,padding:"4px 9px",
                      fontSize:12,color:"#374151",fontFamily:"Inter,sans-serif"}}>Edit</button>
                    <button onClick={e=>{e.stopPropagation();setDeleteConfirm(menu);}} style={{background:"none",
                      border:"1px solid #fecaca",cursor:"pointer",borderRadius:8,padding:"4px 9px",
                      fontSize:12,color:"#dc2626",fontFamily:"Inter,sans-serif"}}>Del</button>
                  </div>
                </td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </div>

    {showAdd && <AddMenuModal menus={menus} onSave={addMenu} onClose={()=>setShowAdd(false)}/>}
    {editMenu && <EditMenuModal menu={editMenu} onSave={saveEdit} onClose={()=>setEditMenu(null)}/>}
    {deleteConfirm && <ConfirmModal open={true}
      title="Delete Menu?"
      message={`Are you sure you want to delete "${deleteConfirm.name_th}" (${deleteConfirm.menu_id})?`}
      danger={true}
      onConfirm={()=>deleteMenu(deleteConfirm.id)}
      onCancel={()=>setDeleteConfirm(null)}/>}
  </div>;
}

// ── APP ROOT ──────────────────────────────────────────────────────────────────
function App(){
  const {token, login, gisReady}=useAuth();
  const [menus,   setMenus,  , setTkM,  fpM,  seM]  = useSave("Menus",             SHEETS.Menus,             INITIAL_MENUS);
  const [recipeIng,setRecipeIng,,setTkRI, fpRI, seRI] = useSave("RecipeIngredients", SHEETS.RecipeIngredients, INITIAL_RECIPE_INGREDIENTS);
  const [steps,   setSteps,  , setTkS,  fpS,  seS]  = useSave("CookingSteps",      SHEETS.CookingSteps,      INITIAL_COOKING_STEPS);

  useEffect(()=>{
    if(!token)return;
    setTkM(token); setTkRI(token); setTkS(token);
  },[token]);

  const anySaveError=seM||seRI||seS;
  const [syncing,setSyncing]=useState(false);
  const handleSync=async()=>{
    setSyncing(true);
    fpM(); fpRI(); fpS();
    setTimeout(()=>setSyncing(false),2500);
  };

  const [page,setPage]=useState("overview");
  const [selectedMenu,setSelectedMenu]=useState(null);

  const [editIngMenu,setEditIngMenu]=useState(null);
  const [editStepsMenu,setEditStepsMenu]=useState(null);
  const [showLogin,setShowLogin]=useState(false);

  const viewRecipe=(menu)=>{ setSelectedMenu(menu); setPage("recipe"); };
  const saveIng=(menuId, rows)=>{
    setRecipeIng(d=>[...d.filter(r=>r.menu_id!==menuId), ...rows]);
    setEditIngMenu(null);
  };
  const saveSteps=(menuId, rows)=>{
    setSteps(d=>[...d.filter(s=>s.menu_id!==menuId), ...rows]);
    setEditStepsMenu(null);
  };

  return <div style={{display:"flex",minHeight:"100vh"}}>
    <Sidebar
      page={page} setPage={p=>{setPage(p);setSelectedMenu(null);}}
      token={token} onLogin={()=>{if(token)return; setShowLogin(true); login();}}
      onSync={handleSync} syncing={syncing} saveError={anySaveError}
    />
    <div style={{flex:1,overflowY:"auto",minHeight:"100vh"}}>
      {page==="overview" && <OverviewPage menus={menus} recipeIng={recipeIng} steps={steps} setPage={setPage}/>}
      {page==="menus" && !selectedMenu &&
        <MenusPage menus={menus} setMenus={setMenus} recipeIng={recipeIng} steps={steps}
          token={token} onViewRecipe={viewRecipe}/>}
      {page==="recipe" && selectedMenu &&
        <RecipeDetailPage
          menu={menus.find(m=>m.id===selectedMenu.id)||selectedMenu}
          recipeIng={recipeIng} steps={steps} token={token}
          onEdit={()=>setEditIngMenu(null)}
          onEditIng={()=>setEditIngMenu(selectedMenu)}
          onEditSteps={()=>setEditStepsMenu(selectedMenu)}
          onBack={()=>{ setPage("menus"); setSelectedMenu(null); }}
        />}
    </div>

    {!token && showLogin && <LoginPrompt onLogin={login} gisReady={gisReady}/>}

    {editIngMenu && <EditIngredientsModal
      menu={editIngMenu} recipeIng={recipeIng}
      onSave={saveIng} onClose={()=>setEditIngMenu(null)}/>}
    {editStepsMenu && <EditStepsModal
      menu={editStepsMenu} steps={steps}
      onSave={saveSteps} onClose={()=>setEditStepsMenu(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
