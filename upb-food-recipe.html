            <td className="td" style={{fontSize:11,color:"#9ca3af"}}>{i.last_price_date||"—"}</td>
            <td className="td"><div style={{display:"flex",gap:5}}>
              <button onClick={()=>setEditI(i)} className="btn btn-o" style={{fontSize:12,padding:"4px 10px"}}>Edit</button>
              <button onClick={()=>setDelId(i.id)} className="btn" style={{fontSize:12,padding:"4px 10px",background:"#fee2e2",color:"#991b1b"}}>Del</button>
            </div></td>
          </tr>;
        })}</tbody>
      </table>
    </div>}
    <EditIngredientModal open={showAdd||!!editI} onClose={()=>{setShowAdd(false);setEditI(null);}} ingr={editI} onSave={save}/>
    <UploadIngrModal open={showUpload} onClose={()=>setShowUpload(false)} existingIngredients={ingredients} updateIngredients={updateIngredients}/>
    {delId&&<div className="ov"><div className="mb" style={{maxWidth:360}}>
      <h3 style={{fontSize:16,fontWeight:700,margin:"0 0 8px"}}>Delete Ingredient?</h3>
      <p style={{fontSize:13,color:"#6b7280",marginBottom:20}}>Existing recipe lines using this ingredient won't be affected.</p>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <button onClick={()=>setDelId(null)} className="btn btn-o">Cancel</button>
        <button onClick={()=>del(delId)} className="btn btn-r">Delete</button>
      </div>
    </div></div>}
  </div>;
}

/* ── IngrSearchDropdown ── */
function IngrSearchDropdown({ingredients,value,onChange}){
  const[q,setQ]=useState("");
  const[open,setOpen]=useState(false);
  const ref=useRef(null);
  const sel=ingredients.find(i=>i.id===value);
  const filtered=useMemo(()=>{
    const s=q.toLowerCase().trim();
    if(!s)return ingredients;
    return ingredients.filter(i=>
      (i.name||"").toLowerCase().includes(s)||
      (i.name_th||"").toLowerCase().includes(s)||
      (i.supplier||"").toLowerCase().includes(s)||
      (i.ingr_category||"").toLowerCase().includes(s)
    );
  },[ingredients,q]);
  useEffect(()=>{
    function handler(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener("mousedown",handler);return()=>document.removeEventListener("mousedown",handler);
  },[]);
  const isPC=(i)=>toBool(i.is_precooked);
  return <div ref={ref} style={{position:"relative"}}>
    {sel&&!open&&<div style={{background:"#f0fdf4",border:"1.5px solid #16a34a",borderRadius:8,padding:"7px 12px",fontSize:13,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"space-between"}}
      onClick={()=>{setQ("");setOpen(true);}}>
      <div>
        <span style={{fontWeight:600}}>{sel.name}</span>{sel.name_th&&<span style={{color:"#6b7280",marginLeft:6,fontSize:12}}>{sel.name_th}</span>}
        <span style={{marginLeft:8,color:"#166534",fontSize:12}}>{fmtB(sel.cost_per_unit)}/{sel.unit||"unit"}</span>
        {isPC(sel)&&<span style={{marginLeft:6,fontSize:11,background:"#fef3c7",color:"#92400e",padding:"1px 6px",borderRadius:9999}}>🍳</span>}
      </div>
      <span style={{fontSize:11,color:"#9ca3af"}}>▼</span>
    </div>}
    {(!sel||open)&&<input className="inp" placeholder="🔍 Search ingredient (EN / TH / supplier)…"
      value={q} autoFocus={open}
      onChange={e=>{setQ(e.target.value);setOpen(true);}}
      onFocus={()=>setOpen(true)}/>}
    {open&&<div style={{position:"absolute",zIndex:200,background:"#1e2433",border:"1px solid #374151",borderRadius:10,width:"100%",maxHeight:280,overflowY:"auto",boxShadow:"0 8px 30px rgba(0,0,0,.35)",marginTop:3}}>
      <div onClick={()=>{onChange("");setOpen(false);setQ("");}}
        style={{padding:"9px 14px",cursor:"pointer",borderBottom:"1px solid #374151",color:"#9ca3af",fontSize:13,display:"flex",alignItems:"center",gap:6}}>
        <span style={{color:"#16a34a"}}>✓</span> — select —
      </div>
      {filtered.length===0&&<div style={{padding:"12px 14px",color:"#6b7280",fontSize:13}}>No results for "{q}"</div>}
      {filtered.map(i=><div key={i.id}
        onClick={()=>{onChange(i.id);setOpen(false);setQ("");}}
        style={{padding:"9px 14px",cursor:"pointer",borderBottom:"1px solid #2d3748",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8}}
        onMouseEnter={e=>e.currentTarget.style.background="#2d3748"}
        onMouseLeave={e=>e.currentTarget.style.background=""}>
        <div>
          <div style={{fontWeight:500,color:"#f1f5f9",fontSize:13}}>{i.name}
            {isPC(i)&&<span style={{marginLeft:6,fontSize:10,background:"#92400e",color:"#fef3c7",padding:"1px 5px",borderRadius:9999}}>🍳 Pre-Cooked</span>}
          </div>
          {i.name_th&&<div style={{fontSize:11,color:"#94a3b8"}}>{i.name_th}{i.supplier?` · ${i.supplier}`:""}{i.ingr_category?` · ${i.ingr_category}`:""}</div>}
        </div>
        <div style={{textAlign:"right",flexShrink:0}}>
          <div style={{fontSize:12,color:"#4ade80",fontWeight:600}}>{fmtB(i.cost_per_unit)}<span style={{fontWeight:400,color:"#6b7280"}}>/{i.unit||"unit"}</span></div>
        </div>
      </div>)}
    </div>}
  </div>;
}

/* ── EditRecipeModal ── */
function EditRecipeModal({open,onClose,menu,recipeLines,updateRecipeLines,ingredients}){
  const lines=useMemo(()=>recipeLines.filter(r=>String(r.menu_id)===String(menu?.id)),[recipeLines,menu]);
  const[nl,setNl]=useState({ingredient_id:"",ingredient_name:"",usage_qty:"",usage_unit:""});
  const selIngr=useMemo(()=>ingredients.find(i=>i.id===nl.ingredient_id),[ingredients,nl.ingredient_id]);
  const previewCost=useMemo(()=>calcLineIngCost(selIngr,nl.usage_qty),[selIngr,nl.usage_qty]);
  function onSelIngr(id){const i=ingredients.find(x=>x.id===id);setNl(p=>({...p,ingredient_id:id,ingredient_name:i?.name||"",usage_unit:i?.unit||""}));}
  function addLine(){
    if(!nl.ingredient_id||!nl.usage_qty)return;
    updateRecipeLines(prev=>[...prev,{id:uid(),menu_id:menu.id,ingredient_id:nl.ingredient_id,ingredient_name:nl.ingredient_name,usage_qty:+nl.usage_qty,usage_unit:nl.usage_unit,ingredient_cost:previewCost}]);
    setNl({ingredient_id:"",ingredient_name:"",usage_qty:"",usage_unit:""});
  }
  function delLine(id){updateRecipeLines(prev=>prev.filter(l=>l.id!==id));}
  function updateQty(id,qty){
    const q=parseFloat(qty)||0;
    updateRecipeLines(prev=>prev.map(l=>{
      if(l.id!==id)return l;
      const ingr=ingredients.find(x=>x.id===l.ingredient_id);
      const newCost=ingr?calcLineIngCost(ingr,q):Math.round((parseFloat(l.ingredient_cost||0)/parseFloat(l.usage_qty||1))*q*10000)/10000;
      return{...l,usage_qty:q,ingredient_cost:newCost};
    }));
  }
  if(!menu)return null;
  return <Modal open={open} onClose={onClose} title={`Recipe Ingredients — ${menu.menu_id}`} wide>
    {lines.length===0?<div style={{padding:"16px 0",textAlign:"center",color:"#9ca3af",fontSize:13}}>No ingredients added yet.</div>:
    <div className="card" style={{overflow:"hidden",marginBottom:18}}>
      <table style={{width:"100%",borderCollapse:"collapse"}}>
        <thead><tr><th className="th">Ingredient</th><th className="th" style={{textAlign:"right"}}>Qty</th><th className="th">Unit</th><th className="th" style={{textAlign:"right"}}>Cost</th><th className="th"/></tr></thead>
        <tbody>{lines.map(l=><tr key={l.id}>
          <td className="td"><div style={{fontWeight:500}}>{l.ingredient_name}</div>
            {(()=>{const i=ingredients.find(x=>x.id===l.ingredient_id);return i?.name_th?<div style={{fontSize:11,color:"#9ca3af"}}>{i.name_th}</div>:null;})()}
          </td>
          <td className="td" style={{textAlign:"right"}}>
            <input type="number" min="0" step="0.001" value={l.usage_qty}
              onChange={e=>updateQty(l.id,e.target.value)}
              style={{width:72,textAlign:"right",border:"1px solid #d1fae5",borderRadius:6,padding:"3px 6px",fontSize:13,fontWeight:600,background:"#f0fdf4",color:"#166534",outline:"none"}}
              onFocus={e=>{e.target.select();e.target.style.borderColor="#16a34a";}}
              onBlur={e=>e.target.style.borderColor="#d1fae5"}/>
          </td>
          <td className="td" style={{color:"#6b7280"}}>{l.usage_unit||"—"}</td>
          <td className="td" style={{textAlign:"right",fontWeight:600}}>{fmtB(l.ingredient_cost)}</td>
          <td className="td"><button onClick={()=>delLine(l.id)} className="btn" style={{fontSize:11,padding:"3px 8px",background:"#fee2e2",color:"#991b1b"}}>✕</button></td>
        </tr>)}
        <tr><td colSpan={3} className="td" style={{fontWeight:700,textAlign:"right"}}>Raw total:</td>
          <td className="td" style={{fontWeight:700,color:"#166534"}}>{fmtB(lines.reduce((s,l)=>s+parseFloat(l.ingredient_cost||0),0))}</td><td className="td"/></tr>
        </tbody>
      </table>
    </div>}
    <div className="card" style={{padding:16}}>
      <div style={{fontSize:13,fontWeight:700,marginBottom:10,color:"#374151"}}>➕ Add Ingredient Line</div>
      {ingredients.length===0?<div style={{fontSize:13,color:"#d97706"}}>⚠️ No ingredients in master list yet. Go to the <strong>Ingredients</strong> page to add some first.</div>:
      <div style={{display:"grid",gridTemplateColumns:"2fr 1fr 1fr auto",gap:10,alignItems:"end"}}>
        <div><label className="fl">Ingredient</label>
          <IngrSearchDropdown ingredients={ingredients} value={nl.ingredient_id} onChange={onSelIngr}/>
        </div>
        <div><label className="fl">Usage Qty</label><input className="inp" type="number" min="0" step="0.001" value={nl.usage_qty} onChange={e=>setNl(p=>({...p,usage_qty:e.target.value}))}/></div>
        <div><label className="fl">Unit</label><input className="inp" value={nl.usage_unit} onChange={e=>setNl(p=>({...p,usage_unit:e.target.value}))}/></div>
        <button onClick={addLine} className="btn btn-g" disabled={!nl.ingredient_id||!nl.usage_qty}>Add</button>
      </div>}
      {selIngr&&nl.usage_qty&&<div style={{marginTop:10,fontSize:12,color:"#6b7280"}}>
        Cost: ({fmtB(selIngr.cost_per_unit)}/{selIngr.unit||"unit"} ÷ yield {(+selIngr.yield_pct*100).toFixed(0)}%) × {nl.usage_qty} = <strong style={{color:"#166634"}}>{fmtB(previewCost)}</strong>
      </div>}
    </div>
    <div style={{display:"flex",justifyContent:"flex-end",marginTop:14}}>
      <button onClick={onClose} className="btn btn-g">Done</button>
    </div>
  </Modal>;
}

/* ── StorePricesSection ── */
function StorePricesSection({menuId,storePrices,updateStorePrices,stores,costPerServe}){
  const totalCost=costPerServe; // alias for backward compat in render
  const myPrices=useMemo(()=>storePrices.filter(p=>String(p.menu_id)===String(menuId)),[storePrices,menuId]);
  const storeNames=useMemo(()=>[...new Set(stores.map(s=>s.name))],[stores]);
  const[newStore,setNewStore]=useState("");const[newPrice,setNewPrice]=useState("");const[editId,setEditId]=useState(null);const[editPrice,setEditPrice]=useState("");
  function addPrice(){
    const st=newStore.trim();if(!st||!newPrice)return;
    updateStorePrices(prev=>[...prev,{id:uid(),menu_id:menuId,store_name:st,price:+newPrice}]);
    setNewStore("");setNewPrice("");
  }
  function delPrice(id){updateStorePrices(prev=>prev.filter(p=>p.id!==id));}
  function saveEdit(id){updateStorePrices(prev=>prev.map(p=>p.id===id?{...p,price:+editPrice}:p));setEditId(null);}
  return <div className="card" style={{padding:"18px 22px"}}>
    <div style={{fontSize:14,fontWeight:700,marginBottom:14}}>🏪 Store Prices</div>
    {myPrices.length===0?<div style={{fontSize:13,color:"#9ca3af",marginBottom:14}}>No store prices set. Add below.</div>:
    <table style={{width:"100%",borderCollapse:"collapse",marginBottom:14}}>
      <thead><tr><th className="th">Store</th><th className="th" style={{textAlign:"right"}}>Price</th><th className="th" style={{textAlign:"right"}}>Food Cost %</th><th className="th"/></tr></thead>
      <tbody>{myPrices.map(p=>{
        const fcp=totalCost>0&&+p.price>0?totalCost/+p.price:null;
        return <tr key={p.id}>
          <td className="td" style={{fontWeight:500}}>🏪 {p.store_name}</td>
          <td className="td" style={{textAlign:"right"}}>
            {editId===p.id?<div style={{display:"flex",gap:6,justifyContent:"flex-end"}}>
              <input className="inp" type="number" value={editPrice} onChange={e=>setEditPrice(e.target.value)} style={{width:90}}/>
              <button onClick={()=>saveEdit(p.id)} className="btn btn-g" style={{fontSize:11,padding:"3px 8px"}}>✓</button>
              <button onClick={()=>setEditId(null)} className="btn btn-o" style={{fontSize:11,padding:"3px 8px"}}>✕</button>
            </div>:<span style={{fontWeight:600}}>{fmtB(p.price)}</span>}
          </td>
          <td className="td" style={{textAlign:"right"}}><PctBadge pct={fcp}/></td>
          <td className="td"><div style={{display:"flex",gap:5}}>
            {editId!==p.id&&<button onClick={()=>{setEditId(p.id);setEditPrice(String(p.price));}} className="btn btn-o" style={{fontSize:11,padding:"3px 8px"}}>Edit</button>}
            <button onClick={()=>delPrice(p.id)} className="btn" style={{fontSize:11,padding:"3px 8px",background:"#fee2e2",color:"#991b1b"}}>✕</button>
          </div></td>
        </tr>;
      })}</tbody>
    </table>}
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr auto",gap:10,alignItems:"end"}}>
      <div><label className="fl">Store Name</label>
        <input className="inp" list="store-list" value={newStore} onChange={e=>setNewStore(e.target.value)} placeholder="Select or type new…"/>
        <datalist id="store-list">{storeNames.map(n=><option key={n} value={n}/>)}</datalist>
      </div>
      <div><label className="fl">Price (฿)</label>
        <input className="inp" type="number" min="0" value={newPrice} onChange={e=>setNewPrice(e.target.value)}/>
      </div>
      <button onClick={addPrice} className="btn btn-g" disabled={!newStore.trim()||!newPrice}>Add Price</button>
    </div>
    {totalCost>0&&newPrice&&newStore&&<div style={{marginTop:8,fontSize:12,color:"#6b7280"}}>
      Food cost at {fmtB(+newPrice)}: <strong style={{color:pctColor(totalCost/+newPrice)}}>{(totalCost/+newPrice*100).toFixed(1)}%</strong>
    </div>}
  </div>;
}

/* ── RecipePage ── */
function RecipePage({menuId,menus,updateMenus,recipeLines,updateRecipeLines,cookingSteps,updateCookingSteps,ingredients,storePrices,updateStorePrices,stores,onBack}){
  const menu=useMemo(()=>menus.find(m=>m.id===menuId),[menus,menuId]);
  const[showEdit,setShowEdit]=useState(false);const[showAddStep,setShowAddStep]=useState(false);
  const[stepText,setStepText]=useState("");const[editStep,setEditStep]=useState(null);
  const[localPrice,setLocalPrice]=useState("");
  const[saved,setSaved]=useState(false);
  const myLines=useMemo(()=>recipeLines.filter(r=>String(r.menu_id)===String(menuId)),[recipeLines,menuId]);
  const mySteps=useMemo(()=>cookingSteps.filter(s=>String(s.menu_id)===String(menuId)).sort((a,b)=>+a.step_no-+b.step_no),[cookingSteps,menuId]);
  const cost=useMemo(()=>menu?calcMenuCost(menuId,recipeLines,menu):{rawCost:0,totalCost:0,costPerServe:0,suggestExcl:0,suggestIncl:0,foodCostPct:null,lineCount:0},[menuId,recipeLines,menu]);
  const isPC=menu?.menu_type==="precooked";
  useEffect(()=>{if(menu)setLocalPrice(menu.actual_price===""?"":String(menu.actual_price));},[menu?.id]);
  function savePrice(){const val=localPrice===""?"":+localPrice;updateMenus(prev=>prev.map(m=>m.id===menuId?{...m,actual_price:val}:m));}
  function handleSave(){savePrice();setSaved(true);setTimeout(()=>setSaved(false),2500);}
  function updField(k,v){updateMenus(prev=>prev.map(m=>m.id===menuId?{...m,[k]:v}:m));}
  function addStep(){
    if(!stepText.trim())return;
    const mx=mySteps.length>0?Math.max(...mySteps.map(s=>+s.step_no)):0;
    updateCookingSteps(prev=>[...prev,{id:uid(),menu_id:menuId,step_no:mx+1,instruction:stepText.trim()}]);
    setStepText("");setShowAddStep(false);
  }
  function delStep(id){updateCookingSteps(prev=>prev.filter(s=>s.id!==id));}
  function saveStep(id,txt){updateCookingSteps(prev=>prev.map(s=>s.id===id?{...s,instruction:txt}:s));setEditStep(null);}
  if(!menu)return <div style={{flex:1,padding:32,color:"#9ca3af"}}>Menu not found.</div>;
  return <div style={{flex:1,padding:"28px 32px",overflowY:"auto"}}>
    <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16}}>
      <button onClick={onBack} className="btn btn-o" style={{fontSize:12}}>← Back to All Menus</button>
      <button onClick={handleSave} className="btn btn-g" style={{fontSize:12}}>
        {saved?"✓ Saved!":"💾 Save Recipe"}
      </button>
      {saved&&<span style={{fontSize:12,color:"#16a34a",fontWeight:600}}>Changes saved to Sheets</span>}
    </div>
    {isPC&&<div style={{background:"#fef3c7",border:"1px solid #fcd34d",borderRadius:12,padding:"14px 20px",marginBottom:16,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
      <div>
        <div style={{fontSize:13,fontWeight:700,color:"#92400e",marginBottom:4}}>🍳 Pre-Cooked Ingredient Recipe</div>
        <div style={{fontSize:13,color:"#78350f"}}>
          1 batch → <strong>{menu.serves_per_recipe||1} {menu.batch_unit||"Gram"}</strong> at <strong>{fmtB(cost.totalCost)}</strong>
          &nbsp;·&nbsp; Cost: <strong style={{color:"#166534"}}>{fmtB(cost.costPerServe)}/{menu.batch_unit||"Gram"}</strong>
        </div>
        <div style={{fontSize:12,color:"#92400e",marginTop:2}}>Cost per {menu.batch_unit||"Gram"} is automatically pushed to Ingredients — other menus can use it by weight.</div>
      </div>
      <div style={{textAlign:"right"}}>
        <div style={{fontSize:11,color:"#78350f",marginBottom:2}}>Ingredient name in master list:</div>
        <div style={{fontWeight:700,fontSize:15,color:"#166534"}}>"{menu.name_en||menu.name_th}"</div>
      </div>
    </div>}
    {/* header */}
    <div className="card" style={{padding:"20px 24px",marginBottom:20}}>
      <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
        <div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <span style={{fontWeight:800,fontSize:13,color:"#166534"}}>{menu.menu_id}</span>
            {isPC?<span className="badge" style={{background:"#fef3c7",color:"#92400e"}}>🍳 Pre-Cooked</span>:<CatBadge cat={menu.category}/>}
            {toBool(menu.checked)&&<span className="badge" style={{background:"#dcfce7",color:"#166534"}}>✓ Verified</span>}
          </div>
          <h2 style={{fontSize:22,fontWeight:700,margin:"0 0 2px"}}>{menu.name_en}</h2>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
        <div style={{fontSize:14,fontWeight:700}}>👨‍🍳 Cooking Steps ({mySteps.length})</div>
        <button onClick={()=>setShowAddStep(true)} className="btn btn-o" style={{fontSize:12}}>+ Add Step</button>
      </div>
      {mySteps.length===0?<div style={{textAlign:"center",padding:"16px 0",color:"#9ca3af",fontSize:13}}>No steps yet.</div>:
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {mySteps.map((s,i)=><div key={s.id} style={{display:"flex",gap:12,alignItems:"flex-start"}}>
          <div style={{minWidth:28,height:28,borderRadius:"50%",background:"#166534",color:"#fff",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,flexShrink:0}}>{i+1}</div>
          {editStep===s.id?<div style={{flex:1,display:"flex",gap:8}}>
            <input className="inp" defaultValue={s.instruction} id={"s_"+s.id} style={{flex:1}}/>
            <button onClick={()=>saveStep(s.id,document.getElementById("s_"+s.id).value)} className="btn btn-g" style={{fontSize:12}}>Save</button>
            <button onClick={()=>setEditStep(null)} className="btn btn-o" style={{fontSize:12}}>✕</button>
          </div>:<>
            <div style={{flex:1,fontSize:14,color:"#374151",paddingTop:4}}>{s.instruction}</div>
            <button onClick={()=>setEditStep(s.id)} className="btn btn-o" style={{fontSize:11,padding:"3px 8px"}}>Edit</button>
            <button onClick={()=>delStep(s.id)} className="btn" style={{fontSize:11,padding:"3px 8px",background:"#fee2e2",color:"#991b1b"}}>✕</button>
          </>}
        </div>)}
      </div>}
      {showAddStep&&<div style={{marginTop:14,display:"flex",gap:10}}>
        <input className="inp" placeholder="Describe this step…" value={stepText} onChange={e=>setStepText(e.target.value)} style={{flex:1}} onKeyDown={e=>{if(e.key==="Enter")addStep();}}/>
        <button onClick={addStep} className="btn btn-g">Add</button>
        <button onClick={()=>{setShowAddStep(false);setStepText("");}} className="btn btn-o">✕</button>
      </div>}
    </div>
    <EditRecipeModal open={showEdit} onClose={()=>setShowEdit(false)} menu={menu} recipeLines={recipeLines} updateRecipeLines={updateRecipeLines} ingredients={ingredients}/>
  </div>;
}

function DashboardPage({menus,recipeLines,storePrices,setSelectedMenu,setPage}){
  const cats=useContext(CatsCtx);
  const stores=useContext(StoresCtx);
  const enriched=useMemo(()=>menus.map(m=>{
    const c=calcMenuCost(m.id,recipeLines,m);
    const sp=storePrices.filter(p=>String(p.menu_id)===String(m.id));
    const lc=recipeLines.filter(r=>String(r.menu_id)===String(m.id)).length;
    const status=lc>0&&toBool(m.checked)?"verified":lc>0?"has_recipe":"draft";
    return{...m,...c,storeCount:sp.length,status};
  }),[menus,recipeLines,storePrices]);
  const withPrice=useMemo(()=>enriched.filter(m=>m.foodCostPct!==null),[enriched]);
  const avgFoodCost=useMemo(()=>!withPrice.length?null:withPrice.reduce((s,m)=>s+m.foodCostPct,0)/withPrice.length,[withPrice]);
  const allNeedsRecipe=useMemo(()=>enriched.filter(m=>m.status==="draft"&&m.menu_type!=="precooked"),[enriched]);
  const needsRecipe=useMemo(()=>allNeedsRecipe.slice(0,8),[allNeedsRecipe]);
  const highCost=useMemo(()=>[...withPrice].filter(m=>m.foodCostPct!==null).sort((a,b)=>b.foodCostPct-a.foodCostPct).slice(0,8),[withPrice]);
  const catBreakdown=useMemo(()=>{
    const map={};
    enriched.forEach(m=>{
      const k=m.menu_type==="precooked"?"🍳 Pre-Cooked":(m.category||"Other");
      if(!map[k])map[k]={name:k,total:0,withRecipe:0,verified:0};
      map[k].total++;
      if(m.status==="has_recipe"||m.status==="verified")map[k].withRecipe++;
      if(m.status==="verified")map[k].verified++;

    return Object.values(map).sort((a,b)=>b.total-a.total);

    const regularMenuIds=new Set(enriched.filter(m=>m.menu_type!=="precooked").map(m=>m.id));
    return stores.map(s=>{
      const prices=storePrices.filter(p=>p.store_name===s.name);

      const missingMenus=enriched.filter(m=>m.menu_type!=="precooked"&&!prices.some(p=>String(p.menu_id)===String(m.id)));
      return{name:s.name,covered,total:regularMenuIds.size,missingCount:missingMenus.length,missing:missingMenus.slice(0,5)};
    }).sort((a,b)=>b.covered-a.covered);

function App(){
  const{token,login,gisReady}=useAuth();
  const[menus,updMenus,setMenuTok,,menuErr]=useSave("Menus",SHEETS.Menus,INITIAL_MENUS);
  const[ingredients,updIngr,setIngrTok,,ingrErr,ingrLoaded]=useSave("Ingredients",SHEETS.Ingredients,[]);
  const[recipeLines,updLines,setLineTok,,lineErr]=useSave("RecipeLines",SHEETS.RecipeLines,[]);
  const[cookingSteps,updSteps,setStepTok,,stepErr]=useSave("CookingSteps",SHEETS.CookingSteps,[]);
  const[cats,updCats,setCatTok,,catErr]=useSave("Categories",SHEETS.Categories,INITIAL_CATS);
  const[stores,updStores,setStoreTok,,storeErr]=useSave("Stores",SHEETS.Stores,[]);
  const[storePrices,updSP,setSPTok,,spErr]=useSave("StorePrices",SHEETS.StorePrices,[]);
  const[ingrCats,updIngrCats,setIngrCatTok,,ingrCatErr]=useSave("IngrCats",SHEETS.IngrCats,INITIAL_INGR_CATS);
  const saveError=menuErr||ingrErr||lineErr||stepErr||catErr||storeErr||spErr||ingrCatErr;
  const[page,setPage]=useState("dashboard");
  const[selectedMenu,setSelectedMenu]=useState(null);
  const[menuCat,setMenuCat]=useState("All"); // lifted so filter survives recipe navigation
  const[showCatMgr,setShowCatMgr]=useState(false);
  const[showIngrCatMgr,setShowIngrCatMgr]=useState(false);
  const[showStoreMgr,setShowStoreMgr]=useState(false);
  const[syncing,setSyncing]=useState(false);

  useEffect(()=>{
    if(!token)return;
    setMenuTok(token);setIngrTok(token);setLineTok(token);setStepTok(token);
    setCatTok(token);setStoreTok(token);setSPTok(token);setIngrCatTok(token);
  },[token]);

  const handleRefresh=useCallback(()=>{
    if(!token)return;
    setSyncing(true);
    setMenuTok(token);setIngrTok(token);setLineTok(token);setStepTok(token);
    setCatTok(token);setStoreTok(token);setSPTok(token);setIngrCatTok(token);
    setTimeout(()=>setSyncing(false),2000);
  },[token]);

  // Auto-sync: for every pre-cooked menu, ensure a linked ingredient exists and keep its cost_per_unit current
  // Guard: only run after ingredients have been loaded from Sheets, to avoid race condition overwriting real data
  useEffect(()=>{
    if(!ingrLoaded)return;
    const precookedMenus=menus.filter(m=>m.menu_type==="precooked");
    if(!precookedMenus.length)return;
    updIngr(prev=>{
      let changed=false;
      // Use toBool for consistent is_precooked detection regardless of source (gviz / Sheets API / in-memory)
      const linkedIds=new Set(prev.filter(i=>toBool(i.is_precooked)&&i.precooked_menu_id).map(i=>i.precooked_menu_id));
      let working=[...prev];

      // 1. For any pre-cooked menu with no linked stub, first try to adopt an existing ingredient by name, else create a new stub
      for(const m of precookedMenus){
        if(linkedIds.has(m.id))continue;
        const mName=m.name_en||m.name_th||m.menu_id;
        const mNameTh=m.name_th||"";
        // Try to find an unlinked ingredient with matching name (Thai or English)
        const idx=working.findIndex(i=>
          !toBool(i.is_precooked)&&
          ((mNameTh&&(i.name_th===mNameTh||i.name===mNameTh))||(i.name===mName))
        );
        if(idx>=0){
          // Adopt existing ingredient — link it and recalculate
          const c=calcMenuCost(m.id,recipeLines,m);
          const newCpu=Math.round(c.costPerServe*10000)/10000;
          working[idx]={...working[idx],is_precooked:true,precooked_menu_id:m.id,
            name:mName,name_th:mNameTh,unit:m.batch_unit||working[idx].unit||"Gram",
            cost_per_unit:newCpu,supplier:"🍳 Pre-Cooked"};
          linkedIds.add(m.id);
          changed=true;
        }else{
          // No match — create a fresh stub
          const c=calcMenuCost(m.id,recipeLines,m);
          const newCpu=Math.round(c.costPerServe*10000)/10000;
          working.push({id:uid(),name:mName,name_th:mNameTh,
            supplier:"🍳 Pre-Cooked",ingr_category:m.category||"น้ำยำ/ซอสต่างๆ/อาหาร Pre-Cooked",
            purchase_price:0,purchase_qty:1,unit:m.batch_unit||"Gram",
            cost_per_unit:newCpu,vat:false,yield_pct:1,last_price_date:"",
            notes:`Auto-generated from pre-cooked menu ${m.menu_id}`,
            is_precooked:true,precooked_menu_id:m.id});
          changed=true;
        }
      }
      // 2. Sync cost_per_unit, name, and unit for all already-linked stubs
      working=working.map(i=>{
        if(!toBool(i.is_precooked)||!i.precooked_menu_id)return i;
        const m=menus.find(x=>x.id===i.precooked_menu_id);
        if(!m)return i;
        const c=calcMenuCost(i.precooked_menu_id,recipeLines,m);
        const newCpu=Math.round(c.costPerServe*10000)/10000;
        const newName=m.name_en||m.name_th||i.name;
        const newNameTh=m.name_th||i.name_th||"";
        const newUnit=m.batch_unit||i.unit||"Gram";
        if(Math.abs(parseFloat(i.cost_per_unit||0)-newCpu)>0.0001||i.name!==newName||i.name_th!==newNameTh||i.unit!==newUnit){
          changed=true;
          return{...i,cost_per_unit:newCpu,name:newName,name_th:newNameTh,unit:newUnit};
        }
        return i;
      });
      return changed?working:prev;
    });
  },[menus,recipeLines,ingrLoaded]); // intentionally excludes updIngr and ingredients to avoid loops

  // Auto-sync: when any ingredient's cost_per_unit or yield changes, recalculate ingredient_cost on all recipe lines that use it
  useEffect(()=>{
    if(!ingredients.length||!recipeLines.length)return;
    updLines(prev=>{
      let changed=false;
      const updated=prev.map(l=>{
        const ingr=ingredients.find(x=>x.id===l.ingredient_id);
        if(!ingr)return l;
        const newCost=calcLineIngCost(ingr,parseFloat(l.usage_qty)||0);
        if(Math.abs(newCost-parseFloat(l.ingredient_cost||0))>0.001){
          changed=true;
          return{...l,ingredient_cost:newCost};
        }
        return l;
      });
      return changed?updated:prev;
    });
  },[ingredients]); // intentionally excludes updLines and recipeLines to avoid loops

  function navRecipe(id){setSelectedMenu(id);setPage("recipe");}
  const openIngrCatMgr=()=>setShowIngrCatMgr(true);

  if(!token)return <LoginScreen onLogin={login} gisReady={gisReady}/>;

  return <CatsCtx.Provider value={cats}>
    <StoresCtx.Provider value={stores}>
    <IngrCatsCtx.Provider value={ingrCats}>
      <div style={{display:"flex",minHeight:"100vh"}}>
        <Sidebar page={page} setPage={setPage} token={token} onLogin={login} gisReady={gisReady}
          saveError={saveError} onCatMgr={()=>setShowCatMgr(true)} onIngrCatMgr={openIngrCatMgr} onStoreMgr={()=>setShowStoreMgr(true)}
          onRefresh={handleRefresh} syncing={syncing}/>
        {page==="dashboard"&&<DashboardPage menus={menus} recipeLines={recipeLines} storePrices={storePrices} setSelectedMenu={setSelectedMenu} setPage={setPage}/>}
        {page==="menus"&&<MenusPage menus={menus} updateMenus={updMenus} setSelectedMenu={navRecipe}
          ingredients={ingredients} updateIngredients={updIngr} updateRecipeLines={updLines} updateCookingSteps={updSteps}
          recipeLines={recipeLines} cookingSteps={cookingSteps} menuCat={menuCat} setMenuCat={setMenuCat}/>}
        {page==="ingredients"&&<IngredientsPage ingredients={ingredients} updateIngredients={updIngr} onIngrCatMgr={openIngrCatMgr}/>}
        {page==="recipe"&&<RecipePage menuId={selectedMenu} menus={menus} updateMenus={updMenus}
          recipeLines={recipeLines} updateRecipeLines={updLines}
          cookingSteps={cookingSteps} updateCookingSteps={updSteps}
          ingredients={ingredients} storePrices={storePrices} updateStorePrices={updSP}
          stores={stores} onBack={()=>setPage("menus")}/>}
        <ManageCatsModal open={showCatMgr} onClose={()=>setShowCatMgr(false)} cats={cats} updateCats={updCats} menus={menus}/>
        <ManageIngrCatsModal open={showIngrCatMgr} onClose={()=>setShowIngrCatMgr(false)} ingrCats={ingrCats} updateIngrCats={updIngrCats} ingredients={ingredients}/>
        <ManageStoresModal open={showStoreMgr} onClose={()=>setShowStoreMgr(false)} stores={stores} updateStores={updStores} storePrices={storePrices}/>
      </div>
    </IngrCatsCtx.Provider>
    </StoresCtx.Provider>
  </CatsCtx.Provider>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
